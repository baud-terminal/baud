[package]
name = "baud-difftest"
version.workspace = true
edition.workspace = true
# **Not published, and that became load-bearing when this crate joined the
# workspace.** `release-plz.toml` releases every publishable member, and this one
# carries no `license` or `description` -- so a release PR would offer a test
# harness to crates.io and be rejected for missing metadata. It is an oracle
# against an external implementation, not a library anyone depends on, so the
# answer is `publish = false` rather than inventing the metadata.
publish = false

[dependencies]
baud-core = { path = "../baud-core", features = ["alloc"] }
# From crates.io rather than a sibling checkout, for the reason `multibench`'s
# manifest already records: the absolute path it carried
# (`/home/user/t/alacritty/alacritty_terminal`) made this crate unbuildable on
# every machine that was not the one it was written on -- which is all of them,
# including this one. It had therefore **never compiled**, while `BUILD.md`
# listed it as "the only oracle outside this repo" and its own doc comment
# claimed to feed bytes to `baud-core`. An oracle that cannot be built is not an
# oracle, and this is the absent-rather-than-red failure the deletion commit
# records three times over.
#
# Same version `multibench` pins, so the two external comparisons answer to one
# alacritty rather than to two.
# **`default-features = false`, because a dev-only oracle was changing the
# shipped binary.** alacritty's defaults turn on `bitflags/serde`, and Cargo
# unifies features across a workspace build -- so `cargo build --workspace`
# compiled one `bitflags` with `serde` and `baud-app` linked *that* one,
# carrying a serialisation framework it never calls for the sake of a test
# harness. `cargo tree --workspace -e features` reads `default`, `serde`,
# `std` before and `default`, `std` after, and `cargo tree -p baud-app` shows
# no serde either way, which is why building the crate alone never revealed
# it. The oracle is unaffected: `every_case_agrees_with_alacritty` still
# passes, and its pinned normalisation counts -- 4 spacers, 2 tab cells --
# cannot be produced without driving alacritty for real.
alacritty_terminal = { version = "0.26", default-features = false }
