name: Bug report
description: Something behaves differently from what it documents.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest input, command, or snippet that shows it.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version and commit
      description: "Run `baud --version` and paste what it prints."
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture, e.g. `aarch64-darwin`, `x86_64-linux`.
    validations:
      required: false
