name: Bug report
description: Something behaves differently from what it documents.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest input, command, or snippet that shows it.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version and commit
      description: "In a new baud window, outside tmux (it sets its own), `echo $TERM_PROGRAM $TERM_PROGRAM_VERSION` prints baud and its version. Add the commit you built, from `git rev-parse --short HEAD` in your checkout."
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture, e.g. `aarch64-darwin`, `x86_64-linux`.
    validations:
      required: false
