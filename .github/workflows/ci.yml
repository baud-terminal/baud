name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # master is exempt: it is the only ref that publishes, and release-plz
  # publishes, tags and creates a GitHub release as separate steps. A cancel
  # between them cannot be undone, so master runs queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write
  pull-requests: write
  actions: write

# `devenv-checks` runs `devenv test`, the same command a developer runs locally,
# so the workflow is a thin wrapper over the tasks."test:*" set in devenv.nix.
# Add a check by adding a task, never by adding a step here.
#
# release-plz-pr runs after release-plz-release: it computes the next bump from
# the newest tag, which the release job creates.
jobs:
  devenv-checks:
    name: Lint/UT
    runs-on: ubuntu-latest
    # Cold, this builds the whole dev shell. 30 is not enough for that.
    timeout-minutes: 45
    env:
      # CI never opens a debugger, and debuginfo is most of the codegen time and
      # most of target/ - which is also most of what rust-cache uploads and
      # downloads every run. Set here rather than in Cargo.toml so a local build
      # keeps its debugger.
      CARGO_PROFILE_DEV_DEBUG: "0"
    # Skip on release-plz's own Release PR and on the release commit it merges:
    # both touch only Cargo.toml versions and CHANGELOG.md, and the checks
    # already passed on the underlying commits.
    if: |
      !(
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'chore: release')) ||
        (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release'))
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org https://cache.nixos.org https://devenv.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      # The nix store: devenv, the rust toolchain, and every build input.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'devenv.lock') }}
          # No lock hash in the prefix, so a lockfile bump still restores the
          # previous store and builds only the delta.
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Restore everywhere, save only on master. GitHub caches are
          # ref-scoped: a PR reads master's entry but writes its own, so an
          # ungated save spends ~2GB of the 10GB repo budget per open PR and
          # evicts the cargo caches.
          save: ${{ github.ref == 'refs/heads/master' }}
          purge: ${{ github.ref == 'refs/heads/master' }}
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          # A safety valve, not a routine step. Below the working set this runs
          # GC on every save, and GC roots protect most of the store, so it
          # sheds little and rebuilds it next run.
          gc-max-store-size-linux: 8G

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # In its own step so a shell build failure reads as one, and so the
      # toolchain probes below are instant.
      - name: Build the dev shell
        run: devenv shell true

      # ~/.cargo and ./target.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # cmd-format runs rust-cache's `rustc -vV` and `cargo metadata` probes
          # through devenv, so the key tracks the toolchain that actually
          # compiles rather than the runner image's rustup. It needs devenv, so
          # this step has to stay after the install above.
          cmd-format: "devenv shell -- {0}"
          # `key:` is ignored whenever `shared-key:` is set, so the lockfile
          # hash has to live here.
          shared-key: devenv-${{ hashFiles('devenv.lock') }}
          workspaces: ". -> target"

      - name: Run format & lint checks
        run: devenv test

      # **The two AVX2 gates that stood here were `baud-core2`'s, and the steps
      # below replace them.** They ran `cargo test -p baud-core2 --test parser
      # generated_programs_match_on_avx2` and grepped the binary for
      # `vpmovmskb`; that crate and its `feed_avx2` are deleted.
      #
      # This comment used to say `baud-core` had no ISA code, that nothing
      # depended on `baud-isa-x86-64` or `baud-isa-aarch64` or tested either,
      # and that wiring them in waited on the owner. All four are stale:
      # `baud-core`'s default `neon-scan` and its off-by-default `avx2-scan`
      # call `Neon::run`, `Neon::stride_three` and `Avx2::run` through safe
      # wrappers under `#![forbid(unsafe_code)]` (`baud-core/Cargo.toml`), and
      # each ISA crate's `tests/agrees.rs` holds its implementation against
      # `Portable`. The aarch64 twin runs on the development box; the AVX2 one
      # runs only here, in the next step, and `bench.yml` proves by disassembly
      # that the AVX2 arm is live.

      # **The AVX2 coverage, restored -- pointing at a target that exists this
      # time.** The two steps removed above named `baud-core2`'s `parser` test
      # and its `feed_avx2`, both deleted. What replaced them is an equivalence
      # property in the crate that owns the code: `Avx2` against `Portable` over
      # 390,625 exhaustive blocks plus every length around a 32-byte step.
      #
      # **This runner is the only machine that can compile it.** The development
      # box is aarch64 with no hosted x86-64 std, so `baud-isa-x86-64/tests/
      # agrees.rs` was written without ever being built -- which is exactly the
      # state that let the crate stop compiling in the first place. If this step
      # is red on its first run, that is the step working.
      # **`RUSTFLAGS` must be set INSIDE `devenv shell`, not in front of it.**
      # devenv's generated shell exports `RUSTFLAGS='-D warnings'` after
      # inheriting the parent environment, so the prefix form this step used is
      # silently discarded -- the `target_feature = "avx2"` cfg stayed false and
      # these two steps tested the portable path while reading as AVX2 coverage.
      # Found by the bench workflow's liveness assertion, which disassembled the
      # arm it had just built and found no 32-byte movemask in it.
      - name: AVX2 scanner agrees with the portable one
        run: |
          set -euo pipefail
          devenv shell -- cargo build --release -p baud-isa-x86-64
          devenv shell -- sh -c \
            "RUSTFLAGS='-C target-feature=+avx2' cargo test --release --no-fail-fast -p baud-isa-x86-64 -- --nocapture"

      # And the arm as `baud-core` would ship it, so the wiring is exercised
      # rather than only the crate.
      #
      # **What this proves is that it compiles and the workspace still passes --
      # not that the flag reaches the scan.** An earlier version of this comment
      # claimed the latter, and it does not follow: `avx2-scan`'s arm is `cfg`'d
      # on `target_feature = "avx2"`, so if that cfg never matched the build
      # would fall through to the portable path and this step would pass
      # unchanged. A step that passes whether or not the thing happened is the
      # probe-that-cannot-fire shape, and claiming otherwise in a comment is how
      # it survives review.
      #
      # Liveness is proved in `bench.yml`, which disassembles both arms and
      # asserts a 32-byte `vpmovmskb %ymm` in the AVX2 one. It belongs there
      # because that step has to build both arms anyway.
      - name: baud-core builds with the AVX2 scan wired in
        run: |
          set -euo pipefail
          RF="-C target-feature=+avx2"
          devenv shell -- sh -c \
            "RUSTFLAGS='$RF' cargo build --release -p baud-core --features avx2-scan"
          devenv shell -- sh -c \
            "RUSTFLAGS='$RF' cargo test --release --no-fail-fast --workspace --features baud-core/avx2-scan"

  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    needs: [devenv-checks]
    timeout-minutes: 30
    # `!cancelled()`, not `always()`: this job publishes to an IMMUTABLE
    # registry, so running it from a cancelled workflow is the one thing that
    # cannot be undone. `skipped` is accepted because devenv-checks skips on
    # the release commit itself (see its `if`).
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      (needs.devenv-checks.result == 'success' || needs.devenv-checks.result == 'skipped')
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          # release-plz diffs against the previous tag, so it needs full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.131
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens/updates the Release PR that bumps the version and writes CHANGELOG.md.
  # MUST run after release-plz-release — see the anti-loop note at the top.
  release-plz-pr:
    name: Release-PR
    runs-on: ubuntu-latest
    needs: [devenv-checks, release-plz-release]
    timeout-minutes: 20
    # Requires Release to have SUCCEEDED: a failed publish leaves no new tag,
    # which would re-trigger the same redundant-PR loop. On an ordinary feature
    # merge Release succeeds as a no-op, so this never blocks the first PR.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      (needs.devenv-checks.result == 'success' || needs.devenv-checks.result == 'skipped') &&
      needs.release-plz-release.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.131
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
