name: Bench (x86-64)

# The x86-64 half of the comparison.
#
# baud has only ever been measured on two hosts: a Linux Xeon whose numbers
# predate most of the current code, and an arm64 Mac. Neither can produce a
# trustworthy x86-64 figure today — the Mac only via Rosetta, which translates
# AVX2 into NEON and makes any timing a measurement of the translator. This
# workflow is real x86-64 silicon with a real n_tty, which is the only place
# where baud's AVX2 path and the tty tax both exist.
#
# It does NOT gate anything. A shared GitHub runner is noisy, so the numbers are
# a tripwire and a cross-host sanity check, not a merge criterion. Ratios within
# one run are the finding; absolutes are not portable off this runner.

on:
  # Scoped to this file so editing the harness re-validates it, and so the
  # workflow registers at all: GitHub does not always parse a workflow whose
  # only triggers are workflow_dispatch and schedule until it has run once.
  # Deliberately NOT on every push -- a cold run builds the dev shell and
  # ghostty from source, and gating merges on a shared, noisy runner is exactly
  # the cross-machine comparison MEASUREMENTS.md warns against.
  push:
    paths:
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      reps:
        description: "median-of-N per core"
        default: "9"
  schedule:
    # Weekly, so drift shows up as a trend rather than as a surprise.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  bench:
    name: multibench on x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org https://cache.nixos.org https://devenv.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # Record what we are actually measuring on. A benchmark without its host
      # is not a measurement, and this file's whole convention is that every
      # table carries host, harness, statistic and payload.
      - name: Host facts
        run: |
          echo "### Host" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uname -srm >> "$GITHUB_STEP_SUMMARY"
          grep -m1 'model name' /proc/cpuinfo >> "$GITHUB_STEP_SUMMARY"
          echo "cores: $(nproc)" >> "$GITHUB_STEP_SUMMARY"
          echo -n "avx2: " >> "$GITHUB_STEP_SUMMARY"
          grep -qm1 ' avx2 ' /proc/cpuinfo && echo yes >> "$GITHUB_STEP_SUMMARY" || echo NO >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ghostty's terminal core, built from source as libghostty-vt. Its own
      # build.zig runs the unicode_tables codegen, which is what used to block
      # bench-others/ghostty-bench.
      - name: Build libghostty-vt
        run: |
          git clone --depth 1 https://github.com/ghostty-org/ghostty.git /tmp/ghostty
          cd /tmp/ghostty
          nix shell nixpkgs#zig_0_16 --command zig build -Demit-lib-vt=true -Doptimize=ReleaseFast || true
          test -f zig-out/lib/libghostty-vt.a && echo "GHOSTTY_LIB_DIR=/tmp/ghostty/zig-out/lib" >> "$GITHUB_ENV"

      # Both transports. Through a PTY is what a terminal faces; from memory is
      # the only way to compare parsers, because on a fast core the transport is
      # most of the measured time — 89% for baud on Darwin.
      - name: Bench through a real PTY
        run: |
          echo "### Through a real PTY (n_tty)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          devenv shell -- cargo run --release -q --manifest-path bench-others/multibench/Cargo.toml \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Bench from memory
        env:
          TRANSPORT: memory
        run: |
          echo "### From memory (no PTY)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          devenv shell -- cargo run --release -q --manifest-path bench-others/multibench/Cargo.toml \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The tty tax on this host, which only Linux can answer: n_tty caps
      # read(2) at N_TTY_BUF_SIZE-1 regardless of the buffer offered.
      #
      # **`-p baud-bench` used to be enough and is not any more.** That crate's
      # default binary was the span-model PTY harness and it went with
      # `baud-core2`; `cargo run -p baud-bench` now names no target. This step
      # ran green on 2026-09-07 and has not run since, so nothing reported the
      # break -- the same absent-rather-than-red failure the deletion commit
      # records three times over.
      - name: baud alone, transport ceiling
        run: |
          echo "### transport ceiling: read and discard, no parser" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          devenv shell -- cargo run --release -q -p baud-bench --bin transport -- utf8/btop.raw 48 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # **The AVX2 question this workflow's own header was written for**: "this
      # workflow is real x86-64 silicon ... the only place where baud's AVX2
      # path and the tty tax both exist". `avx2-scan` has been correct and
      # CI-verified since it landed and has never been *timed*, because the
      # development box is aarch64.
      #
      # **Both arms carry `-C target-feature=+avx2`.** Only the feature differs.
      # Passing the flag to one arm and not the other would change codegen for
      # the entire workspace and measure the compiler's autovectorisation rather
      # than the hand-written scan -- the "mismatched optimisation flags" entry
      # in MEASUREMENTS.md, one target-feature further along.
      #
      # The third arm is a byte-identical copy of the first. On a shared runner
      # that control is the whole result: without it a 4% difference and a 4%
      # scheduling artefact look the same.
      - name: AVX2 scan A/B, with an A/A control
        env:
          RUSTFLAGS: "-C target-feature=+avx2"
        run: |
          set -euo pipefail
          devenv shell -- cargo build --release -q -p baud-bench --bin ingest2
          cp target/release/ingest2 /tmp/ingest2-base
          cp target/release/ingest2 /tmp/ingest2-aa
          devenv shell -- cargo build --release -q -p baud-bench --bin ingest2 --features avx2-scan
          cp target/release/ingest2 /tmp/ingest2-avx2

          echo "### AVX2 scan A/B (both arms built with +avx2; only the feature differs)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # **The liveness probe asserts, and it asserts on width rather than on
          # presence.** `grep -c vpmovmskb` was the first spelling and it cannot
          # fire here: both arms carry `-C target-feature=+avx2`, so LLVM
          # VEX-encodes the *portable* path's movemask too and the token appears
          # in both binaries. CLAUDE.md's note that "`Portable` compiles to SSE2
          # and yields `pmovmskb` without the `v`" was written for a build
          # *without* `+avx2`; that premise does not hold in this step, and a
          # probe resting on it is `fast_hit` again -- a counter that reports
          # rather than claims.
          #
          # What discriminates is the register. `Avx2::run` is 32 bytes a step,
          # so it movemasks a `%ymm`; the portable loop is `LANE_COUNT` = 16 and
          # movemasks a `%xmm` however it is encoded.
          ymm_v=$(objdump -d /tmp/ingest2-avx2 | grep -cE 'vpmovmskb[[:space:]]+%ymm' || true)
          ymm_b=$(objdump -d /tmp/ingest2-base | grep -cE 'vpmovmskb[[:space:]]+%ymm' || true)
          any_v=$(objdump -d /tmp/ingest2-avx2 | grep -c 'pmovmskb' || true)
          any_b=$(objdump -d /tmp/ingest2-base | grep -c 'pmovmskb' || true)
          {
            echo "movemask, ymm (32-byte): avx2 arm $ymm_v, base arm $ymm_b"
            echo "movemask, any width:     avx2 arm $any_v, base arm $any_b"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Byte-identical binaries are the same program, whatever the features
          # said. This is the check that would have caught the cached-binary
          # comparison on the aarch64 side in one line instead of by noticing
          # "Finished in 0.01s".
          if cmp -s /tmp/ingest2-base /tmp/ingest2-avx2; then
            echo "ARMS ARE THE SAME BINARY -- the feature changed nothing" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$ymm_v" -eq 0 ]; then
            echo "AVX2 ARM IS NOT LIVE: no 32-byte movemask, so the feature did not reach the scan" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "avx2 arm is live and the two binaries differ" | tee -a "$GITHUB_STEP_SUMMARY"

          # Cells must be byte-identical or the two arms are not doing the same
          # work, whatever the timings say. **The emptiness guard is the point**:
          # if the grep stops matching, both sides are the empty string, `!=` is
          # false, and this loop prints "byte-identical" having compared nothing
          # -- which is the empty-equals-empty vacuity the first cell-identity
          # check in this repo actually hit.
          for n in cat git-log less cat-cjk btop; do
            b=$(/tmp/ingest2-base "$n" 2 | grep -oE 'cells [0-9]+' | head -1)
            v=$(/tmp/ingest2-avx2 "$n" 2 | grep -oE 'cells [0-9]+' | head -1)
            if [ -z "$b" ] || [ -z "$v" ]; then
              echo "NO CELL COUNT PARSED on $n -- this check compared nothing" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ "$b" != "$v" ]; then
              echo "CELLS DIFFER on $n: $b vs $v -- the arms are different programs" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "cells byte-identical on all five" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"

          # **Interleaved by round, not blocked by arm.** The first spelling ran
          # six base, then six avx2, then six A/A -- so the A/A column compared
          # one block of the sweep against another block, and a drift between
          # blocks is exactly what it was supposed to detect. CLAUDE.md's cava
          # entry is a ~1% "win" that turned out to be sweep position, and the
          # lesson recorded there is that interleaving A/A *into* the same sweep
          # is what turns a disjoint pair into a null. Round 1 is warm-up and is
          # discarded by the reader.
          printf "%-12s %-6s %s\n" payload arm "rounds, interleaved (MB/s)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          for n in cat git-log less cat-cjk less-cjk btop; do
            case "$n" in less) r=400 ;; less-cjk) r=300 ;; cat-cjk) r=200 ;; *) r=150 ;; esac
            rm -f /tmp/row-base /tmp/row-avx2 /tmp/row-aa
            for i in 1 2 3 4 5 6; do
              for arm in base avx2 aa; do
                v=$(/tmp/ingest2-$arm "$n" "$r" | grep -oE '[0-9]+\.[0-9]+ MB/s' | head -1 | awk '{print $1}')
                printf " %s" "${v:-NA}" >> /tmp/row-$arm
              done
            done
            for arm in base avx2 aa; do
              printf "%-12s %-6s%s\n" "$n" "$arm" "$(cat /tmp/row-$arm)" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Read a row only if its AVX2 range is disjoint from **both** base and A/A." \
            >> "$GITHUB_STEP_SUMMARY"
