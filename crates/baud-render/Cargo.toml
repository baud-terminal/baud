[package]
name = "baud-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "CC-BY-NC-SA-4.0 AND MIT AND Unicode-3.0 AND Zlib"
repository.workspace = true
description = "baud's compositor: cells to instance records to pixels, on the CPU and on the GPU, with the glyph atlas and row-granular damage."
rust-version.workspace = true
readme = "README.md"
keywords = ["terminal", "renderer", "glyph", "atlas"]
categories = ["rendering", "graphics"]
# What crates.io gets: the source, what the build reads, the licence and
# the notices its third-party files need (`cargo xtask publish`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/build.rs", "/build/", "/data/", "/README.md", "/LICENSE", "/NOTICE", "/LICENSES/"]
# Not a native library: the key is what hands this build's `OUT_DIR` to
# the builds of the crates that depend on this one, as
# `DEP_BAUD_RENDER_STRESS_OUT_DIR`, so `baud-present-macos` writes the
# cell shader's copy of the stress skip trie from these bytes.
links = "baud-render-stress"

[dependencies]
baud-domain = { workspace = true }
baud-core = { workspace = true, features = ["alloc"] }
baud-font = { workspace = true }

# The table compiler `build.rs` and `build/*.rs` read the pinned files in
# `data/` with: std alone, no dependencies, at build time only.
[build-dependencies]
baud-tablegen = { workspace = true }

[dev-dependencies]
# `tests/build_tables.rs` runs the build module on perturbed copies of the
# pinned files, so each check it makes is seen to fire.
baud-tablegen = { workspace = true }
# **The counters, on for this crate's own tests** (`src/counters.rs`):
# the copy of the screen's tests (`src/screens.rs`) and `tests/fed_counters.rs`
# feed each place a caret frame is counted at and read that it moved,
# through `counters::take`, which a build without the feature does not
# have, so a test build of this crate alone fails to compile rather than
# leaving them out. Without the defaults, so a test build without them
# stays without them.
baud-render = { path = ".", default-features = false, features = ["counters"] }

[features]
# **`baud-core`'s NEON scan, on**, as the core's own default build has it,
# so a program built on this crate runs the scan the core's default runs.
# The binaries in this workspace take this crate without its defaults and
# name `baud-core`'s themselves, so that a bench can leave the scan out.
default = ["neon-scan"]
neon-scan = ["baud-core/neon-scan"]
# The `differs` count in `Exceptions`: what the cell shader would draw
# wrong, measured on the path that shapes every run. A memo per codepoint,
# so the bench enables it and the app does not.
exceptions = []
# Two measurement arms, off by default. `ceiling-no-window-cache` never *finds* a ligature window in the
# cache (it still writes it), so every window is shaped and the pixels are
# what the base draws: a pessimising probe that prices the miss.
# `ceiling-no-windows` skips the overlay's window walk, so no cross-cell
# ligature is drawn -- wrong on purpose -- and prices the walk with its
# shaping; the candidate detection in `GlyphMap::ensure` runs unchanged under
# it and is priced by neither.
ceiling-no-window-cache = []
ceiling-no-windows = []
# **The ufo trail's saucer posed directly**, off by default:
# `ufo::Pose::posed`, `ufo::body_at` and `ufo::beam_at`, for a flight that
# is not a cursor's. Only baud-app's UFO logo film, a test that
# `tools/baud-pictures logo --ufo` runs, flies one, and it turns this on
# through baud-app's dev-dependency, so no build of the app or of this
# crate as published carries them.
posed-saucer = []
# **What a frame did, counted where it does it** (`src/counters.rs`):
# cells compared, copied and converted, rows laid out, overlay and picture
# cells, link records and image tables, each a thread's count read by
# `counters::take`. Off by default, so nothing that ships carries a store
# on a per-cell path; `baud-present-macos`'s frame-cost harness
# (`tests/caret_frame.rs`) turns it on through its dev-dependency.
counters = []
