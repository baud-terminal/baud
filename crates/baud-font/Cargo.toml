[package]
name = "baud-font"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "CC-BY-NC-SA-4.0 AND Apache-2.0 AND CC-BY-ND-4.0 AND MIT AND MIT-Modern-Variant AND Unicode-3.0"
repository.workspace = true
description = "Font parsing, shaping and rasterisation owned by baud: sfnt/CFF/GSUB/GPOS/morx readers over borrowed bytes, no engine dependencies. no_std."
rust-version.workspace = true
readme = "README.md"
keywords = ["font", "opentype", "truetype", "shaping", "rasterizer"]
categories = ["no-std", "rendering", "parser-implementations", "text-processing"]
# What crates.io gets: the source, what the build reads, the licence and
# the notices its third-party files need (`cargo xtask publish`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/build.rs", "/build/", "/data/", "/README.md", "/LICENSE", "/NOTICE", "/LICENSES/"]

[dependencies]
baud-domain = { workspace = true }

# The table compiler `build.rs` and `build/*.rs` read the pinned files in
# `data/` with: std alone, no dependencies, at build time only.
[build-dependencies]
baud-tablegen = { workspace = true }

[dev-dependencies]
# `tests/build_tables.rs` runs the build modules on perturbed copies of the
# pinned files, so each check they make is seen to fire.
baud-tablegen = { workspace = true }
# **The oracle, not a dependency.** `ttf-parser` never appears in a build of
# the crate; it is what `tests/oracle.rs` disagrees with. The two implement the
# same specification over the same bytes, so every face on this machine is a
# differential test -- the `baud-difftest` discipline, one crate over.
ttf-parser = "0.25.1"
png = "0.18.1"
# Inflates the committed fixtures' zlib streams, which the generators in
# `tests/writer/` hold to the rows they compute.
miniz_oxide = "0.9.1"
# The hostile-input property: a font from disk is the same class of input as
# bytes from a pty, and the contract is that no byte string panics.
proptest = "1"
ab_glyph_rasterizer = "0.1.10"
