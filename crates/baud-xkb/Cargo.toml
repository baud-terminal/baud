[package]
name = "baud-xkb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "CC-BY-NC-SA-4.0 AND HPND AND HPND-sell-variant AND MIT AND X11"
repository.workspace = true
description = "An XKB keymap compiler for the keymap text a Wayland compositor hands a client: the four sections, the interpret step, and the key state machine; no libxkbcommon."
rust-version.workspace = true
readme = "README.md"
keywords = ["xkb", "keyboard", "keymap", "wayland", "linux"]
categories = ["os::linux-apis", "parser-implementations"]
# What crates.io gets: the source, what the build reads, the licence and
# the notices its third-party files need (`cargo xtask publish`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/build.rs", "/README.md", "/LICENSE", "/NOTICE", "/LICENSES/", "/xkbcommon-keysyms.h"]
