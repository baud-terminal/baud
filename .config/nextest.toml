# **Every test ends at a time bound, for a hang:** nextest terminates the
# test's process group after 20 periods of 60 s, 20 minutes. It is not a memory
# bound: at 0.8 GiB/s, 20 minutes is 960 GiB, and `scripts/bounded` is the
# memory bound. The slowest real test read 363 s, in a suite at load average
# 30-50 (`graph::classes::the_alphabet_reduces_as_the_stride_doubles`), then
# 341 s and 234 s, so the bound is three times that: a loaded machine must not
# fail a green test. The 60 s period is nextest's default, so what counts as
# slow does not move.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 20 }
# **The window tests run only when they are named**: `titlebar_mark` and
# `about_window` build AppKit windows, so no run leaves them in unasked.
# `cargo nextest run --ignore-default-filter -p baud --test titlebar_mark`, or
# `cargo test -p baud --test titlebar_mark`, runs one.
default-filter = "not (package(baud) & (binary(titlebar_mark) | binary(about_window)))"

# `xtask/tests/bounded.rs`'s hogs touch more than 1 GiB each: one at a time,
# and each is capped at 3 GiB.
[test-groups]
bounded-hogs = { max-threads = 1 }
# **The tests that open ptys share 32 slots of 4 ptys, 128 ptys at once.**
# A stock Mac allows 511 ptys in all (`kern.tty.ptmx_max`), the windows
# open on it and every other suite included, so three suites at once fit
# beside 127 terminals: 3 * 128 = 384. A test takes a slot for each 4 ptys
# it holds at its peak, `threads-required` past one. The peaks, counted at
# every open as the managers this process holds: 64 and 48 for the two
# below, 3 or fewer for every other test in the group, which takes one
# slot. A test that opens a pty outside the group fails
# (`baud-app/src/pty/budget.rs`).
pty = { max-threads = 32 }
# **The tests that make a Metal device run two at a time.** Under nextest
# each test is a process of its own, and each of these makes its own
# device and command queue, so unbounded a suite starts as many GPU clients
# at once as it has test threads. The GPU firmware has taken a kernel panic
# with ten of these processes starting at once, beside other suites and
# the event rig. `xtask/tests/metal_group.rs` finds every test binary
# that makes a device, or starts the app, which makes one, and holds it to
# this group.
metal = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(xtask) & binary(bounded)'
test-group = 'bounded-hogs'

# **The shader-cache fault runs alone**: it takes every test thread, so
# nothing else in the run is beside it, the `metal` group's tests included.
# Its children fault inside Metal's shader compiler on purpose.
[[profile.default.overrides]]
filter = 'package(baud-present-macos) & binary(shader_cache_fault)'
test-group = '@global'
threads-required = 'num-test-threads'

# The Metal tests (`metal` above). `on_screen`'s windows, never shown, make
# one through AppKit, measured; `present` draws to IOSurfaces and makes
# none, measured, and is held with the present path's other tests.
# `gpu_fault` makes a Gpu and a Presenter to hold and fail their completions.
[[profile.default.overrides]]
filter = 'package(baud-present-macos) & (binary(cells) | binary(metallib) | binary(suite_archive) | binary(on_screen) | binary(present) | binary(gpu_fault))'
test-group = 'metal'

# The app's tests: the about window's and the title bar's windows make a
# device through AppKit, measured, and each event rig row's child is the
# app, which makes its device on its probe thread. The rig's two row tests
# run one child at a time, so this group's two slots also bound the ptys
# the rig's children hold: two children's.
[[profile.default.overrides]]
filter = 'package(baud) & (binary(event_rig) | binary(about_window) | binary(titlebar_mark))'
test-group = 'metal'

# The Vulkan tests: each makes a Vulkan device and a queue (`Gpu::new`),
# lavapipe's on the CPU and radv's on the GPU, so they share the bound the
# Metal tests are held to.
[[profile.default.overrides]]
filter = 'package(baud-present-vulkan) & (binary(lavapipe) | binary(radv) | binary(instance_path) | binary(effect_building) | binary(effect_pixels) | binary(fireworks_pixels) | binary(layouts) | binary(sheets) | binary(lend) | binary(cell_path) | binary(blend_rounding) | binary(premultiply_store) | binary(scenes_basic) | binary(scenes_bidi) | binary(scenes_compose) | binary(scenes_fonts) | binary(scenes_chrome) | binary(presenter) | binary(descriptors) | binary(cell_effects) | binary(shipped_stages))'
test-group = 'metal'

# 16 threads holding 4 spawned terminals each, all at once.
[[profile.default.overrides]]
filter = 'package(baud) & test(=pty::tests::terminals_spawned_at_once_hold_none_of_each_others_ends)'
test-group = 'pty'
threads-required = 16

# 48 threads opening and closing at once.
[[profile.default.overrides]]
filter = 'package(baud) & test(=pty::tests::terminals_opened_at_once_all_open)'
test-group = 'pty'
threads-required = 12

# Every other module whose tests open ptys, and baud-bench's two suites
# over a pty. The event rig's children are bounded by `metal` instead.
[[profile.default.overrides]]
filter = '(package(baud) & (test(/^pty::/) | test(/^programs::/) | test(/^app::launch_tests::/) | test(/^film::/))) | (package(baud-bench) & (binary(host) | binary(capture)))'
test-group = 'pty'

# The tests that run real programs in a pty (baud-app/src/programs.rs)
# were marked leaky, passing, at nextest's default leak timeout of 100 ms
# in 3 of 45 runs, and in none of 30 at two seconds. Each waits for the
# child it forked before it ends, and the child holds only its pty; what
# holds the output open is not known.
[[profile.default.overrides]]
filter = 'package(baud) & test(/^programs::/)'
leak-timeout = "2s"

# The same mark on baud-bench's host suite; each test waits for what it
# starts, and what holds the output open is not known. 2 s does not always
# cover it: a run can still print LEAK and pass.
[[profile.default.overrides]]
filter = 'package(baud-bench) & binary(host)'
leak-timeout = "2s"
