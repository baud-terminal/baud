# **Every test ends at a time bound, for a hang:** nextest terminates the
# test's process group after 20 periods of 60 s, 20 minutes. It is not a memory
# bound: at 0.8 GiB/s, 20 minutes is 960 GiB, and `scripts/bounded` is the
# memory bound. The slowest real test read 363 s, in a suite at load average
# 30-50 (`graph::classes::the_alphabet_reduces_as_the_stride_doubles`), then
# 341 s and 234 s, so the bound is three times that: a loaded machine must not
# fail a green test. The 60 s period is nextest's default, so what counts as
# slow does not move.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 20 }

# `xtask/tests/bounded.rs`'s hogs touch more than 1 GiB each: one at a time,
# and each is capped at 3 GiB.
[test-groups]
bounded-hogs = { max-threads = 1 }
# **The tests that open ptys share 32 slots of 4 ptys, 128 ptys at once.**
# A stock Mac allows 511 ptys in all (`kern.tty.ptmx_max`), the windows
# open on it and every other suite included, so three suites at once fit
# beside 127 terminals: 3 * 128 = 384. A test takes a slot for each 4 ptys
# it holds at its peak, `threads-required` past one. The peaks, counted at
# every open as the managers this process holds: 64 and 48 for the two
# below, 3 or fewer for every other test in the group, which takes one
# slot. A test that opens a pty outside the group fails
# (`baud-app/src/pty/budget.rs`).
pty = { max-threads = 32 }

[[profile.default.overrides]]
filter = 'package(xtask) & binary(bounded)'
test-group = 'bounded-hogs'

# 16 threads holding 4 spawned terminals each, all at once.
[[profile.default.overrides]]
filter = 'package(baud) & test(=pty::tests::terminals_spawned_at_once_hold_none_of_each_others_ends)'
test-group = 'pty'
threads-required = 16

# 48 threads opening and closing at once.
[[profile.default.overrides]]
filter = 'package(baud) & test(=pty::tests::terminals_opened_at_once_all_open)'
test-group = 'pty'
threads-required = 12

# Every other module whose tests open ptys, the app's children in the
# event rig, and baud-bench's two suites over a pty.
[[profile.default.overrides]]
filter = '(package(baud) & (test(/^pty::/) | test(/^programs::/) | test(/^app::launch_tests::/) | test(/^film::/) | binary(event_rig))) | (package(baud-bench) & (binary(host) | binary(capture)))'
test-group = 'pty'

# The tests that run real programs in a pty (baud-app/src/programs.rs)
# were marked leaky, passing, at nextest's default leak timeout of 100 ms
# in 3 of 45 runs, and in none of 30 at two seconds. Each waits for the
# child it forked before it ends, and the child holds only its pty; what
# holds the output open is not known.
[[profile.default.overrides]]
filter = 'package(baud) & test(/^programs::/)'
leak-timeout = "2s"

# The same mark on baud-bench's host suite; each test waits for what it
# starts, and what holds the output open is not known. 2 s does not always
# cover it: a run can still print LEAK and pass.
[[profile.default.overrides]]
filter = 'package(baud-bench) & binary(host)'
leak-timeout = "2s"
