[package]
name = "multibench"
version = "0.1.0"
edition = "2021"
[dependencies]
alacritty_terminal = { path = "../../../alacritty/alacritty_terminal" }
vt100 = "0.16"
termwiz = { version = "0.23", default-features = false }
baud-core = { path = "../../baud-core", features = ["alloc"] }
libc = "0.2"
tattoy-wezterm-term = "0.1.0-fork.5"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
