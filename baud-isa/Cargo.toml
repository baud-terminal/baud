[package]
name = "baud-isa"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Instruction-set implementations of baud's domain-typed scan operations. no_std, allocation-free."
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "terminal", "scan"]
categories = ["no-std", "hardware-support"]
# What crates.io gets: the source, what the build reads, the licence and
# the notices its third-party files need (`scripts/check-publish.py`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/README.md", "/LICENSE"]

# **Domain-typed, not primitive.** Every operation here takes and returns
# `baud-domain`'s types -- `ByteLen`, `LaneMask`, `Lane` -- because the whole
# reason to have a crate boundary here is reuse, and a crate exporting
# `fn movemask(v) -> u32` exports the bug class the newtypes exist to prevent.
[dependencies]
baud-domain = { workspace = true }

[features]
# **Off by default, and it adds no crate.** `std` is only the standard library,
# for the one probe that has to ask an operating system: the Linux sysfs walk
# in `sysfs.rs`. The trait it feeds, `CacheProbe`, is `no_std`, and the two
# per-arch crates implement it from an instruction where the hardware
# answers directly (`CPUID` on x86-64) -- `std` is what they enable when it
# does not (`CCSIDR_EL1` traps at EL0 on aarch64).
std = []
