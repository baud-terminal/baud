# How session.gif was made: the tour played in baud's window and filmed
# (the [mp4] below, the take's own record, kept beside its file and not in
# this repository), then encoded to this GIF by the pinned ffmpeg and
# gifski with the commands in [encoder]. --verify checks the GIF's bytes and
# hash and the commit; the GIF's own frames are not checked against the
# MP4 by it.
#
# Check it: cargo run --example demo -- --verify docs/assets/readme/session.gif

made = "cargo run --release --example demo -- --record ../lead/tour.mp4 --forbidden LIST --controls FILE"
from = "."

[baud]
commit = "968446bc026fbe9f95242820b03c3d3cfd16eb1a"
tree = "clean"
dirty = []
features = [
  "take",
]
macos = "27.3"

