# --- Speed ----------------------------------------------------------------

[[feature]]
id = "ingest"
area = "speed"
name = "Takes in output fast"
does = "On real recorded program output, baud's core was faster than ghostty's and alacritty's on all nine recordings, from 1.19 to 5.80 times ghostty's rate; on the Chinese, Japanese and Korean recordings baud also does more work, grouping every character."
status = "built"
platform = "both"
measured = ["Against other implementations, on real capture"]

[[feature]]
id = "pty-ingest"
area = "speed"
name = "Ahead through a real terminal connection"
does = "On one Mac, through the same kind of connection a shell uses, baud led four other terminals on four of five recordings and used the least CPU on all but one."
status = "interim"
gap = "measured before scrollback existed and not taken again since."
platform = "macos"
measured = ["Five terminals through a pty"]

[[feature]]
id = "echo-early"
area = "speed"
name = "What you type shows before the shell answers"
does = "At a prompt your shell marks, a typed character is drawn about 3 ms sooner, and quietly taken back if the shell shows something else."
status = "built"
platform = "macos"
tests = ["baud-render/tests/predicted.rs::a_prediction_gives_way_to_a_cell_the_walk_already_drew", "baud-app/src/app.rs::a_reset_drops_outstanding_predictions_as_contradicted"]
measured = ["A key's echo drawn before the pty answers (row 9)"]

[[feature]]
id = "key-during-flood"
area = "speed"
name = "Keys first, even during a flood"
does = "A key typed while a program streams output is drawn at once, about 2.8 ms sooner, instead of waiting for the next frame."
status = "built"
platform = "macos"
measured = ["Pacing a keystroke's frame by completion (row 6)"]

[[feature]]
id = "key-to-screen"
area = "speed"
name = "About 3 ms from key to screen"
does = "A keystroke reaches the screen in about 3 ms through cat on a 120 Hz Mac, and baud can print the figure for your own machine (`BAUD_KEYLAT=1`)."
status = "built"
platform = "macos"
tests = ["baud-app/src/latency.rs::off_stores_nothing_and_never_reads_the_clock"]
measured = ["Keystroke to pixel"]

[[feature]]
id = "idle"
area = "speed"
name = "Quiet when idle"
does = "An idle window draws nothing and uses about half a percent of one core; a steady cursor costs no frames at all."
status = "built"
platform = "macos"
tests = ["baud-app/src/caret.rs::never_is_never"]
measured = ["Idle CPU (row 11, measured, no change)"]

[[feature]]
id = "no-half-drawn"
area = "speed"
name = "No half-drawn screens"
does = "Programs that redraw in one go, such as btop, neovim and helix, never show a half-finished screen, and a program that stalls can't hold the window for more than 33 ms."
status = "built"
platform = "both"
tests = ["baud-core/tests/xterm/embedder_modes.rs::synchronized_output_toggles", "baud-core/tests/reverse_flips.rs::a_change_inside_a_synchronised_update_is_held"]
rows = ["vt:`CSI ? 2026 h/l`"]
chips = ["synchronised output"]

[[feature]]
id = "cold-launch"
area = "speed"
name = "Quick to start"
does = "The GPU shaders ship already built, which took a cold launch from 390 ms to 134 ms when it was measured."
status = "built"
platform = "macos"
tests = ["baud-present-macos/tests/metallib.rs::the_library_was_built_from_the_shaders_beside_it"]
measured = ["The shipped `.metallib` (row 1, kept)"]

[[feature]]
id = "smooth-resize"
area = "speed"
name = "Smooth resizing and zoom"
does = "A resize or zoom step costs well under a microsecond of the core's time against an 8 ms frame."
status = "built"
platform = "macos"
measured = ["A drag step's core work (row 10, measured, no change)"]

[[feature]]
id = "memory"
area = "speed"
name = "Light on memory"
does = "A 200 by 50 terminal adds about 0.3 MB of real memory until it fills, because space nothing has written costs nothing."
status = "interim"
gap = "measured on the previous core and argued, not measured again, on this one."
platform = "both"
measured = ["Storage"]

