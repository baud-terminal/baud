[[feature]]
id = "status-line-lights"
area = "window"
name = "Activity lights on DEC's status line"
does = "When a program shows DEC's indicator status line, one setting also puts five of the activity lights on it as words after the printer: CD, OH, CS, FAX and SYN, each there while what it shows holds and following it within the 80 milliseconds DEC's standard gives the line. CD or OH reads CD? or OH? when baud cannot tell. The lights keep all nine wherever they are drawn. Past 37 points of the default font the words are left out, so they never flash past the web accessibility guidelines' limit. Hold the pointer over a word to see what it means, the light's own hover text, in a box baud draws itself, which stays while the pointer is on the word or the box and goes with a key. Off by default."
