[[feature]]
id = "iterm2-messages"
area = "programs"
name = "Programs that send OSC 1337"
does = "A program or shell script can, through `OSC 1337`, change the cursor's shape, erase the history, tell the title which folder and host it is in, copy text to the clipboard, recolour the text, the background, the cursor, the selection and the sixteen colours, ask for your attention, ask how big a cell is, highlight the row the cursor is on, mark a line that Cmd-Up and Cmd-Down stop at, show PNG, JPEG and GIF pictures inline, an animated GIF playing, post a notification, with a subtitle and a picture from a file on your machine, switch to Unicode 8's character widths, ask which features baud has, show a badge, a large faint label such as the host or the branch in the top right behind the text, and set user variables, whose values baud never sends back to a program that asks, so a remote program cannot read what your shell set. A message that would bring the window to the front, switch your settings or upload your files is refused."
status = "partial"
gap = "A badge shows its text and the values of user variables, not the rest of the badge format's expressions, and has no outline. Pictures in formats other than PNG, JPEG and GIF, a notification's picture in those other formats, file downloads, annotations, foldable blocks and Touch Bar labels are not built."
platform = "both"
tests = ["crates/baud-core/tests/iterm.rs::cursor_shape_sets_the_shape_and_keeps_the_blink", "crates/baud-core/tests/iterm.rs::current_dir_and_remote_host_name_the_directory", "crates/baud-core/tests/iterm.rs::copy_puts_the_text_on_the_clipboard", "crates/baud-core/tests/iterm.rs::set_colors_sets_each_colour_named", "crates/baud-core/tests/iterm.rs::set_user_var_is_kept_and_reported_empty", "crates/baud-core/tests/iterm.rs::set_mark_is_a_line_the_prompt_jumps_stop_at", "crates/baud-core/tests/notifications.rs::iterm2_notification_posts_its_title_and_message", "crates/baud-app/src/notify.rs::an_iterm2_subtitle_and_picture_reach_the_macos_post", "crates/baud-core/tests/iterm.rs::unicode_version_selects_the_width_tables", "crates/baud-core/tests/iterm_file.rs::an_inline_png_is_placed_at_its_own_size", "crates/baud-core/tests/iterm.rs::capabilities_report_what_baud_does_now", "crates/baud-core/tests/iterm.rs::every_key_not_acted_on_is_counted", "crates/baud-core/tests/iterm.rs::highlight_cursor_line_shows_and_hides_the_guide", "crates/baud-core/tests/iterm.rs::set_badge_format_keeps_the_format_and_refuses_a_call"]
rows = ["vt:`OSC 1337 ; CursorShape=N`", "vt:`OSC 1337 ; ClearScrollback`", "vt:`OSC 1337 ; CurrentDir=dir`, `OSC 1337 ; RemoteHost=user@host`", "vt:`OSC 1337 ; ReportCellSize`", "vt:`OSC 1337 ; ReportVariable=base64`", "vt:`OSC 1337 ; Copy=:base64`", "vt:`OSC 1337 ; SetColors=key=value`", "vt:`OSC 1337 ; SetUserVar=name=base64`", "vt:`OSC 1337 ; SetMark`", "vt:`OSC 1337 ; Notification=title=base64;message=base64`", "vt:`OSC 1337 ; UnicodeVersion=n`", "vt:`OSC 1337 ; File=args, MultipartFile, FilePart, FileEnd`", "vt:`OSC 1337 ; Capabilities`", "vt:`OSC 1337 ; HighlightCursorLine=yes|no`", "vt:`OSC 1337 ; SetBadgeFormat=base64`"]

