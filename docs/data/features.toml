[[feature]]
id = "prompt-at-bottom"
area = "window"
name = "The prompt on the last row"
does = "With `[screen] prompt_at_bottom = \"on\"`, your shell's prompt sits on the window's last row: in a new window, after `clear`, after Control-L, and when your shell redraws it after the window grows. A prompt of several lines lands whole, and earlier output stays where it was. It works with a shell that marks its prompt and where your typing begins, and full-screen programs are left alone."
status = "built"
platform = "both"
tests = ["crates/baud-core/tests/prompt_at_bottom.rs::a_prompt_lands_on_the_last_row_only_with_the_setting_on", "crates/baud-core/tests/prompt_at_bottom.rs::a_growth_at_a_prompt_keeps_it_on_the_last_row", "crates/baud-core/tests/prompt_at_bottom.rs::a_zoom_gesture_leaves_one_prompt_on_the_last_row", "crates/baud-core/tests/prompt_at_bottom.rs::a_two_line_prompt_lands_whole_and_moves_no_output", "crates/baud-core/tests/prompt_at_bottom.rs::a_two_line_prompt_redrawn_moves_no_output", "crates/baud-core/tests/prompt_at_bottom.rs::a_tall_prompt_keeps_the_output_through_a_zoom_at_its_largest", "crates/baud-core/tests/prompt_at_bottom.rs::nothing_but_a_prompt_mark_on_the_primary_moves_the_cursor", "crates/baud-app/src/host.rs::the_prompt_at_bottom_setting_reaches_the_core"]
