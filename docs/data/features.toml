[[feature]]
id = "launch-splash"
area = "window"
name = "A launch splash"
does = "every window opens with baud's colour logo in the middle of it once the window is on screen: a burst of plasma draws it from left to right and a second carries it straight back out from left to right, in one movement, gone about half a second after it starts. The plasma takes the colour of each glyph it passes over: the word's own white (dark on a light page) over \"baud\", the amber over the prompt and the block. Your keys go to the shell the whole time, and the shell's output and prompt show the moment they arrive, in front of the logo, which plays around them. With reduced motion on -- macOS's Reduce Motion, or the Linux desktop's setting once the desktop has reported it -- the logo shows whole and fades instead. The Linux setting arrives just after launch: if it comes while the plasma draws the logo in, the logo shows whole at once, and once the plasma carrying it out has lit, the logo goes. It stays under the flash limits of the web accessibility guidelines (WCAG 2.3.1), follows light and dark, and one setting turns it off. Every window you open after the first plays its own, from the moment it is on screen, and nothing waits for it: the window's shell starts before the window is drawn. On Linux its plasma shows a hard-edged grey band."
status = "built"
platform = "both"
tests = ["crates/baud-present-macos/tests/cells.rs::the_splash_draws_alike_on_every_arm", "crates/baud-render/tests/splash.rs::the_plasma_holds_the_effects_slot", "crates/baud-render/tests/splash.rs::the_plasma_is_the_colour_of_the_glyph_it_is_over", "crates/baud-render/src/splash.rs::the_logo_leaves_as_it_is_drawn", "crates/baud-render/tests/splash.rs::the_first_frame_shows_the_logo_faintly_in_the_plasma", "crates/baud-render/tests/splash.rs::the_held_logo_stays_over_output_and_goes_whole", "crates/baud-bench/tests/splash_flashes.rs::the_splash_is_below_the_flash_thresholds", "crates/baud-app/src/splash.rs::it_plays_on_the_clock_and_is_gone_at_its_end", "crates/baud-app/src/splash.rs::the_plasma_waits_for_the_window_to_be_shown", "crates/baud-app/src/splash.rs::under_reduced_motion_it_holds_until_the_shell_draws_then_fades", "crates/baud-app/src/timed.rs::the_splash_waits_for_the_first_frame_then_plays_and_goes", "crates/baud-render/tests/splash.rs::the_plasma_is_full_strength_and_its_remainder_fades_out", "crates/baud-bench/tests/splash_flashes.rs::the_plasmas_remainder_fades_into_the_page", "crates/baud-app/src/splash.rs::every_frame_the_splash_owes_moves", "crates/baud-app/src/splash.rs::no_splash_frame_waits_on_a_cap_scan", "crates/baud-app/src/splash.rs::the_splash_is_gone_at_its_end", "crates/baud-app/src/config.rs::the_launch_splash_is_on_unless_turned_off", "crates/baud-app/src/app.rs::every_window_plays_the_logo_as_the_launchs_does", "crates/baud-app/src/app.rs::no_key_or_read_waits_on_the_splash", "crates/baud-app/src/splash.rs::every_linux_window_plays_the_logo_as_the_launchs_does", "crates/baud-app/src/splash.rs::each_window_plays_its_own_splash_on_its_own_clock", "crates/baud-app/src/timed.rs::a_windows_splash_waits_on_nothing_and_changes_only_the_logo"]

[[feature]]
id = "activity-lights"
area = "window"
name = "Activity lights"
does = "Nine small lights, named and ordered as in the table of front-panel lights in a 1988 U.S. Robotics Courier manual, with FAX in ARQ's place as on the V.34 Courier, each lit only by something baud measured: HS (High Speed) while the program's output floods in, AA (Auto Answer) when baud answers the program on its own, CD (Carrier Detect) while the program in front is ssh with its connection up, OH (Off Hook) while a program other than the shell is in front, RD (Receive Data) and SD (Send Data) for data baud receives and sends, CS (Clear to Send) while the program takes what baud sends, out while it is not taking it, FAX while a picture is shown, and SYN while the program holds the screen to draw it at once. On macOS they make a modem's panel at the right of the title bar, baud's logo and all nine lights on one plate, each lamp over its letters, and stay in it in full screen, hidden with it where macOS hides it until you move the pointer to the top of the screen; in a narrow window the leftmost lights go first and the plate shrinks with them, the logo staying whole. Or, on either system, on a thin line of their own above the program's first line -- Linux's place, whose window has no title bar -- or under its last, only as tall as the lights (15 points), less than a text row at the 13 point default. The program is never told about that line: its rows and its text area leave it out, and smooth scrolling slides the text past it while the line holds still. The plate is your theme's background, on the line a small rounded one beside each light's letters, in the title bar one with a bevel and a socket behind each lamp, both made from your theme's background so they hold on any page, and every lamp is one of your theme's sixteen colours exactly: lit, a dot with a soft glow of its colour, whose strength one setting sets; unlit, a dot half the size, so the state reads by size as well as colour; a light baud may not read, a ring. Which colour each light takes is one setting: baud's own set, one colour a kind and CS green for a clear line, the default; the colours the IEC 60073 standard gives an indicator's meaning; or every lamp red, as the modems' front panels were. An unlit light is colour 8 in every set. Each light has its own hover text. They never flash more than three times a second, hold steady under Reduce Motion, lose their glow under Dim Flashing Lights on macOS, follow your theme, and one setting moves them or turns them all off. On Linux, CD is not built: it is always dark there, even with ssh in front, rather than the ring a light baud may not read is drawn as, and with no desktop setting for Dim Flashing Lights a lit light always glows, the three-a-second limit still holding."
status = "partial"
gap = "on Linux the CD light is not built."
platform = "both"
tests = ["crates/baud-render/tests/activity_lights.rs::each_light_is_drawn_in_its_state_with_its_letters_to_the_left", "crates/baud-render/tests/activity_lights.rs::the_strip_is_its_lights_side_by_side", "crates/baud-render/tests/activity_lights.rs::the_lights_flash_at_most_three_times_a_second_and_show_everything", "crates/baud-render/tests/activity_lights.rs::cs_is_lit_while_the_line_is_clear", "crates/baud-render/tests/activity_lights.rs::a_state_that_toggles_fast_is_one_steady_light", "crates/baud-render/tests/activity_lights.rs::reduce_motion_holds_a_light_steady_while_the_activity_lasts", "crates/baud-render/tests/activity_lights.rs::a_refused_read_shows_a_ring_and_keeps_the_clock", "crates/baud-render/tests/activity_lights.rs::every_light_changing_at_once_flashes_under_the_area_clause", "crates/baud-render/tests/activity_lights.rs::every_panel_lamp_changing_at_once_flashes_under_the_area_clause", "crates/baud-render/tests/activity_lights.rs::every_lamp_pixel_on_the_panel_is_its_palette_entry", "crates/baud-render/tests/activity_lights.rs::the_socket_and_the_bevel_hold_on_any_page", "crates/baud-app/src/lights.rs::a_narrow_window_drops_the_leftmost_and_the_plate_shrinks", "crates/baud-app/src/palette.rs::a_theme_files_socket_and_bevel_come_from_its_page", "crates/baud-app/src/lights.rs::each_lights_rectangle_maps_to_its_own_hover_text", "crates/baud-app/src/lights.rs::the_lights_sit_at_the_strips_right_and_a_narrow_window_drops_the_leftmost", "crates/baud-app/src/lights.rs::the_driver_ticks_feeds_and_places_the_lights", "crates/baud-app/src/lights.rs::dim_flashing_lights_draws_the_lights_without_their_glow", "crates/baud-app/src/front.rs::off_hook_is_a_job_other_than_the_shell_in_front", "crates/baud-app/src/front.rs::carrier_detect_is_an_ssh_in_front_with_its_connection_up", "crates/baud-app/src/front.rs::a_refused_read_is_neither_lit_nor_dark", "crates/baud-app/src/front.rs::the_lights_off_read_no_process", "crates/baud-app/src/access.rs::reduce_motion_holds