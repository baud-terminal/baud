# --- Speed ----------------------------------------------------------------

[[feature]]
id = "ingest"
area = "speed"
name = "Takes in output fast"
does = "On real recorded program output, baud's core was faster than ghostty's and alacritty's on every recording measured: 1.19 to 5.80 times ghostty's rate on six recordings, and 1.65 to 1.70 times on three captured later, in a sweep not comparable with the first; on the Chinese, Japanese and Korean recordings baud also does more work, grouping every character."
status = "built"
platform = "both"
measured = ["Against other implementations, on real capture"]

[[feature]]
id = "pty-ingest"
area = "speed"
name = "Ahead through a real terminal connection"
does = "On one Mac, through the same kind of connection a shell uses, baud led four other terminals on four of five recordings and used the least CPU on all but one."
status = "interim"
gap = "measured before scrollback existed and not taken again since."
platform = "macos"
measured = ["Five terminals through a pty"]

[[feature]]
