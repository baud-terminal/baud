# Every feature baud has, in plain words, with the proof behind it.
#
# scripts/gen-features.py renders this as docs/guide/features.md and fails
# (`--check`, run by baud-core/tests/feature_list.rs) when a proof is gone,
# when a feature marked built names none, or when the page differs from what
# it writes. Edit this file, never the page.
#
# [[area]]      id, title and a one-line intro, in the order the page shows them
#
# [[feature]]
#   id          a stable key
#   area        an [[area]] id
#   name        a few words
#   does        what it does for you, in one or two sentences
#   status      built | partial | interim (a stopgap until a decided
#               replacement lands)
#   gap         for partial and interim: what is missing
#   platform    both (the shared core and renderer: the macOS app, and the
#               Linux version, which has run only headless) | macos | linux
#   tests       "<path>::<fn>" -- the fn must be in that file
#   rows        "vt:<first cell>" or "input:<first cell>" of a row in
#               docs/vt-coverage.md or docs/input-coverage.md; a built
#               feature's rows must all be done
#   paths       files that hold it
#   measured    headings of MEASUREMENTS.md
#   chips       protocol names, from [[protocol]], shown small after the line
#   behind      where other terminals do more; listed under "Where baud is
#               behind"
#   roadmap     ids in docs/data/roadmap.toml that close a gap
#   shipped     done ids in docs/data/roadmap.toml this feature covers
#
# A built feature names at least one test, a done row or a measurement.
#
# [[missing]]   what is not built: name, does, area, roadmap
# [[unlisted]]  a done roadmap item that is not a feature: id, why
# [[protocol]]  name, origin, row

intro = """
What baud does for you today, by area. Every line is backed by a test or a
measurement in the repository, and the build fails if that proof disappears,
so this list cannot quietly fall out of date. What is coming next is on the
[roadmap](../roadmap.md).
"""

legend = """
Lines with no mark work in the macOS app and in the shared terminal core,
which the Linux version also runs; the Linux version has run only headless so
far. *macOS* marks what only the macOS app does, and *Linux, headless so far*
what only the Linux version does. **Partly** says what part is missing, and
**For now** marks a stopgap until its replacement lands.
"""

protocols_intro = """
The protocols and extensions baud speaks, for anyone checking a particular
one. Every control sequence has its own row in the
[coverage table](../vt-coverage.md), and every key in the
[input table](../input-coverage.md).
"""

behind_intro = """
Where other terminals do more today, and what baud does not do yet, with a
link where the [roadmap](../roadmap.md) plans it.
"""

footer = """
This page is generated from `docs/data/features.toml` by
`scripts/gen-features.py`, which fails the build when a feature's proof is gone,
when a feature marked built names none, when a done item on the
[roadmap](../roadmap.md) is missing from this list, or when this page has been
edited by hand. Every test run of the project runs this check.
"""

[[area]]
id = "programs"
title = "Programs just work"
intro = "Shells, editors and full-screen programs get the terminal they expect, and a broken one can't upset it."

[[area]]
id = "speed"
title = "Speed"
intro = "Measured on real recordings and real keystrokes, with the numbers kept in [MEASUREMENTS.md](../../MEASUREMENTS.md)."

[[area]]
id = "text"
title = "Text, fonts and emoji"
intro = "Text that lines up, in any script, with fonts that work out of the box."

[[area]]
id = "input"
title = "Keyboard, mouse and clipboard"
intro = "Every key reaches the program, and copying and pasting stay safe."

[[area]]
id = "scroll"
title = "Scrollback, selection and resizing"
intro = "Your history stays where you left it, through output, selection and resizing."

[[area]]
id = "window"
title = "Window, colours and bell"
intro = "A see-through window that follows your Mac's appearance."

[[area]]
id = "cursor"
title = "The cursor"
intro = "Your shape and blink, and an optional trail when it jumps."

[[area]]
id = "images"
title = "Pictures"
intro = "Image viewers and file-manager previews show real pictures."

[[area]]
id = "platforms"
title = "Platforms and settings"
intro = "Where baud runs, and the one settings file."

[[area]]
id = "embedding"
title = "Embedding the core"
intro = "The part of baud that understands a program's output, as a library."

# --- Programs just work ---------------------------------------------------

[[feature]]
id = "true-answers"
area = "programs"
name = "No wrong answers"
does = "A question baud cannot answer truthfully gets no reply rather than a wrong one, and a setting baud does not have is reported as unknown, never as off."
status = "built"
platform = "both"
tests = ["baud-core/tests/color_scheme.rs::other_private_dsrs_stay_unsupported"]
rows = ["vt:`CSI $ p`", "vt:`CSI n`"]

[[feature]]
id = "damaged-codes"
area = "programs"
name = "A damaged escape code can't clear your screen"
does = "A broken or cut-off control sequence is thrown away instead of being half-obeyed, and hidden data in the stream is never printed."
status = "built"
platform = "both"
tests = ["baud-core/tests/esc_abandons.rs::an_esc_in_the_parameters_starts_a_new_sequence", "baud-core/tests/xterm/osc.rs::a_bare_esc_cancels_the_osc"]
rows = ["vt:`sos_pm_apc_string`"]

[[feature]]
id = "no-flooding"
area = "programs"
name = "No flooding memory"
does = "A giant title, link or other string a program sends is cut to size, so it can't fill memory."
status = "built"
platform = "both"
tests = ["baud-core/tests/xterm/osc.rs::an_overlong_title_is_truncated"]

[[feature]]
id = "compatible"
area = "programs"
name = "Compatible with what programs expect"
does = "baud answers to the VT100, VT220, VT420 and xterm feature sets, checked against the original manuals, and works under every common terminal type from xterm-256color to vt100."
status = "built"
platform = "both"
tests = ["baud-core/tests/conformance/input_caps.rs::the_profiles_input_counts_are_what_baud_can_send"]
