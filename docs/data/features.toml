[[feature]]
id = "hindi-words"
area = "text"
name = "Hindi set like print"
does = "Each Hindi word is drawn whole at its font's own spacing, its letters joined under one headline as in print, and centred in the columns your shell counts for it. A word too wide for them reaches into the empty columns beside it, keeping a word space from the next; in the built-in font, or any other with a width axis, it is drawn narrower at full height. Nothing is ever drawn smaller. A comma, a hyphen or a bracket written against a word stays against it, and the cursor and a selection mark the whole syllable they are on."
status = "partial"
gap = "with a font that has no width axis, such as the Mac's Kohinoor Devanagari, a word too wide for its room overlaps the next, most often while a program asks for grapheme cluster mode (?2027); the bar, underline and unfocused cursors stay on their column; a selection is not widened to whole syllables, and a rectangular one's edges follow each row's letters rather than a straight column; a block cursor on an empty column a word reaches shows that word's ink inside it, in the cursor's text colour; a block cursor on Hindi an input method is still composing covers its own column rather than the whole syllable, and so does the cursor when a composed word reaches the line's last column; a program's background colours stay on their columns; on a double-width or double-height line each syllable is drawn alone."
platform = "both"
tests = ["crates/baud-render/tests/devanagari_words.rs::no_glyph_is_scaled_and_words_keep_a_word_space", "crates/baud-render/tests/devanagari_words.rs::a_word_is_laid_where_harfbuzz_runs_it", "crates/baud-render/tests/devanagari_words.rs::the_block_cursor_lights_the_syllable_that_holds_its_cell", "crates/baud-render/tests/devanagari_words.rs::a_selection_lights_exactly_the_syllables_it_selects", "crates/baud-render/tests/devanagari_words.rs::no_ink_lies_in_the_colour_of_its_ground", "crates/baud-render/tests/devanagari_words.rs::a_word_written_against_punctuation_is_laid_against_it", "crates/baud-render/tests/devanagari_words.rs::a_selection_across_words_leaves_no_hole", "crates/baud-render/tests/devanagari_words.rs::a_rectangular_selection_lights_each_rows_syllables", "crates/baud-render/tests/devanagari_words.rs::a_block_blinked_off_lights_nothing", "crates/baud-font/tests/devanagari.rs::narrowed_noto_shapes_as_harfbuzz_does", "crates/baud-present-macos/tests/cells.rs::a_devanagari_word_and_its_lights_draw_alike_on_every_arm", "crates/baud-app/src/host.rs::the_launch_stack_narrows_devanagari_on_the_built_faces_width_axis"]

