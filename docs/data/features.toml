# --- Programs just work ---------------------------------------------------

[[feature]]
id = "true-answers"
area = "programs"
name = "No wrong answers"
does = "A question baud cannot answer truthfully gets no reply rather than a wrong one, and a setting baud does not have is reported as unknown, never as off."
status = "built"
platform = "both"
tests = ["baud-core/tests/color_scheme.rs::other_private_dsrs_stay_unsupported"]
rows = ["vt:`CSI $ p`", "vt:`CSI n`"]

[[feature]]
id = "vt420-answers"
area = "programs"
name = "A VT420's questions, answered"
does = "Programs that ask a VT420's status questions get true answers: where the cursor is and on which page, whether a printer is there, the keyboard, the locator and stored macros. They can also read back the cursor's state, the tab stops, the colour table and the terminal's whole state in one report, and put any of them back later."
status = "built"
platform = "both"
tests = ["baud-core/tests/vt420/reports.rs::decxcpr_reports_the_cursor_with_its_page", "baud-core/tests/vt420/presentation.rs::a_report_fed_back_restores_what_it_reported", "baud-core/tests/vt420/state_reports.rs::decrsts_restores_what_every_tsi_control_reports"]
rows = ["vt:`CSI ? 6 n` to `CSI ? 85 n`", "vt:`CSI Ps $ w`", "vt:`DCS Ps $ t D...D ST`", "vt:`CSI Ps $ u`", "vt:`DCS Ps $ p D...D ST`"]
shipped = ["F1-60", "F1-61"]

[[feature]]
id = "xterm-settings"
area = "programs"
name = "xterm's own settings"
does = "Programs can switch xterm's own settings and ask which are on: jumping to the live screen on output or on a key, reverse wrap past the left margin, hiding the scrollbar, copying a selection to the clipboard, keeping a selection's text to copy after a program writes over it, and the alternate-screen variants."
status = "built"
platform = "both"
tests = ["baud-core/tests/xterm_resources.rs::each_mode_answers_what_baud_does_at_power_on", "baud-core/tests/xterm_resources.rs::each_switch_sets_resets_saves_and_restores", "baud-app/src/seat.rs::output_over_a_selection_leaves_its_text_while_1040_is_set"]
