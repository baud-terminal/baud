# Every feature baud has, in plain words, with the proof behind it.
#
# `cargo xtask features` renders this as docs/guide/features.md and fails
# (`--check`, run by crates/xtask/tests/features.rs) when a proof is gone,
# when a feature marked built names none, or when the page differs from what
# it writes. Edit this file, never the page.
#
# [[area]]      id, title and a one-line intro, in the order the page shows them
#
# [[feature]]
#   id          a stable key
#   area        an [[area]] id
#   name        a few words
#   does        what it does for you, in one or two sentences
#   status      built | partial | interim (a stopgap)
#   gap         for partial and interim: what is missing
#   platform    both (the shared core and renderer: the macOS app and the
#               Linux version) | macos | linux
#   tests       "<path>::<fn>" -- the fn must be in that file
#   rows        "vt:<first cell>" or "input:<first cell>" of a row in
#               docs/vt-coverage.md or docs/input-coverage.md; a built
#               feature's rows must all be done
#   paths       files that hold it
#   measured    headings of MEASUREMENTS.md
#   chips       protocol names, from [[protocol]], shown small after the line
#
# A built feature names at least one test, a done row or a measurement.
#
# [[protocol]]  name, row

intro = """
What baud does for you today, by area. Every line is backed by a test or a
measurement in the repository, and the build fails if that proof disappears,
so this list cannot quietly fall out of date.
"""

legend = """
Lines with no mark work in baud on macOS and in baud on Linux under Wayland,
which share the terminal core and the renderer. *macOS* marks what only the
macOS app does, and *Linux* what only the Linux version does. **Partly** says
what part is missing.
"""

protocols_intro = """
The protocols and extensions baud speaks, for anyone checking a particular
one. Every control sequence has its own row in the
[coverage table](../vt-coverage.md), and every key in the
[input table](../input-coverage.md).
"""

footer = """
This page is generated from `docs/data/features.toml` by
`cargo xtask features`, which fails the build when a feature's proof is gone,
when a feature marked built names none, or when this page has been edited by
hand. Every test run of the project runs this check.
"""

[[area]]
id = "programs"
title = "Programs just work"
intro = "Shells, editors and full-screen programs get the terminal they expect, and a broken one can't upset it."

[[area]]
id = "speed"
title = "Speed"
intro = "Measured on real recordings and real keystrokes, with the numbers kept in [MEASUREMENTS.md](../../MEASUREMENTS.md)."

[[area]]
id = "text"
title = "Text, fonts and emoji"
intro = "Text that lines up, in any script, with fonts that work out of the box."

[[area]]
id = "input"
title = "Keyboard, mouse and clipboard"
intro = "Every key reaches the program, and copying and pasting stay safe."

[[area]]
id = "scroll"
title = "Scrollback, selection and resizing"
intro = "Your history stays where you left it, through output, selection and resizing."

[[area]]
id = "window"
title = "Window, colours and bell"
intro = "A see-through window that follows your Mac's appearance."

[[area]]
id = "cursor"
title = "The cursor"
intro = "Your shape and blink, and an optional trail when it jumps."

[[area]]
id = "images"
title = "Pictures"
intro = "Image viewers and file-manager previews show real pictures."

[[area]]
id = "platforms"
title = "Platforms and settings"
intro = "Where baud runs, and the one settings file."

[[area]]
id = "embedding"
title = "Embedding the core"
intro = "The part of baud that understands a program's output, as a library."

# --- Programs just work ---------------------------------------------------

[[feature]]
id = "true-answers"
area = "programs"
name = "No wrong answers"
does = "A question baud cannot answer truthfully gets no reply rather than a wrong one, and a setting baud does not have is reported as unknown, never as off."
status = "built"
platform = "both"
tests = ["crates/baud-core/tests/color_scheme.rs::other_private_dsrs_stay_unsupported"]
rows = ["vt:`CSI $ p`", "vt:`CSI n`"]

[[feature]]
id = "vt420-answers"
area = "programs"
name = "A VT420's questions, answered"
does = "Programs that ask a VT420's status questions get true answers: where the cursor is and on which page, whether a printer is there, the keyboard, the locator and stored macros. They can also read back the cursor's state, the tab stops, the colour table and the terminal's whole state in one report, and put any of them back later."
status = "built"
platform = "both"
tests = ["crates/baud-core/tests/vt420/reports.rs::decxcpr_reports_the_cursor_with_its_page", "crates/baud-core/tests/vt420/presentation.rs::a_report_fed_back_restores_what_it_reported", "crates/baud-core/tests/vt420/state_reports.rs::decrsts_restores_what_every_tsi_control_reports"]
rows = ["vt:`CSI ? 6 n` to `CSI ? 85 n`", "vt:`CSI Ps $ w`", "vt:`DCS Ps $ t D...D ST`", "vt:`CSI Ps $ u`", "vt:`DCS Ps $ p D...D ST`"]

[[feature]]
id = "xterm-settings"
area = "programs"
name = "Settings a program can switch"
does = "Programs can switch these settings and ask which are on: jumping to the live screen on output or on a key, reverse wrap past the left margin, hiding the scrollbar, copying a selection to the clipboard, keeping a selection's text to copy after a program writes over it, and the alternate-screen variants."
status = "built"
platform = "both"
tests = ["crates/baud-core/tests/xterm_resources.rs::each_mode_answers_what_baud_does_at_power_on", "crates/baud-core/tests/xterm_resources.rs::each_switch_sets_resets_saves_and_restores", "crates/baud-app/src/seat.rs::output_over_a_selection_leaves_its_text_while_1040_is_set"]
rows = ["vt:`?1010`", "vt:`?1041`", "vt:`?30`", "vt:`CSI ? 1040 h/l`"]

[[feature]]
id = "terminal-answers"
area = "programs"
name = "Programs can ask what the terminal does"
does = "Editors and multiplexers can ask which bytes each key sends, how many colours there are and which terminal this is, and an editor on another computer that asks whether 24-bit colour works turns it on from baud's answer."
status = "built"
platform = "both"
tests = ["crates/baud-core/tests/xterm/tcap.rs::xtgettcap_answers_a_key_as_it_would_be_sent_now", "crates/baud-core/tests/xterm/tcap.rs::neovims_truecolor_query_is_refused_at_tc", "crates/baud-core/tests/vt220/dcs.rs::neovims_truecolor_probe_is_answered_in_t416s_form", "crates/baud-core/tests/vt220/dcs.rs::every_colour_reports_in_t416s_form"]
rows = ["vt:`DCS + q Pt ST`", "vt:`DCS $ q Pt ST`"]

[[feature]]
id = "program-notifications"
area = "programs"
name = "Notifications and progress bars from programs"
does = "A build or a long command can post a desktop notification when it finishes, with a title, a body and buttons, shown while baud's window is in the background or whenever the program asks; and it can show a progress bar, in the Dock on macOS. A flood of them is held to four at once and then one a second, and `[screen] notifications = \"off\"` turns them off. A program can also ask for your attention: the Dock icon bounces on macOS, and fireworks go off at the cursor."
status = "partial"
gap = "on macOS a program that asks hears a notification went out before you have allowed them."
platform = "both"
tests = ["crates/baud-core/tests/notifications.rs::kittys_examples_post_what_they_say", "crates/baud-core/tests/notifications.rs::the_query_answers_what_the_embedder_delivers", "crates/baud-app/src/notify.rs::the_macos_driver_makes_the_calls_the_plan_says", "crates/baud-app/src/bus.rs::notifications_marshal_as_dbus_next_marshals_them", "crates/baud-core/tests/notifications.rs::fireworks_reach_the_embedder_at_the_cursor"]
rows = ["vt:`OSC 9 ; Pt`", "vt:`OSC 9 ; 4 ; st ; pr`", "vt:`OSC 777 ; notify ; title ; body`", "vt:`OSC 99 ; metadata ; payload`", "vt:`OSC 1337 ; RequestAttention=Pv`"]
chips = ["desktop notifications (OSC 99)"]

[[feature]]
id = "build-version"
area = "window"
name = "Which build this is"
does = "baud says which build it is: the version and the commit it was built from, `<version>+<commit>`, with `.dirty` when it was built from uncommitted changes and `unknown` from a source archive. `baud --version` prints it, then baud's copyright and licence and where the third-party notices are, a program can read it from `TERM_PROGRAM_VERSION` and by asking the terminal, and on macOS the title bar shows it at its left, giving way first in a narrow window. On macOS, baud > About baud opens a window with the version, how long ago that release was made, in macOS's own words such as \"3 hours ago\" or \"2 weeks ago\" and worked out each time the window opens, the home page and the licence, beside the author's picture, which opens the author's GitHub profile when clicked; from the app bundle it plays the logo's plasma over and over while the window is open, a click on it or Space pauses it, and under Reduce Motion it shows the logo still. A build from a source archive shows no age, and a build with no app bundle no picture."
status = "built"
platform = "both"
tests = ["crates/baud-app/tests/version.rs::a_clean_tree_is_the_short_hash", "crates/baud-app/src/version.rs::version_says_the_copyright_the_licence_and_where_credits_are", "crates/baud-app/src/version.rs::a_normal_start_prints_no_version_or_credits", "crates/baud-app/tests/credits.rs::version_prints_its_line_then_the_notices_and_touches_nothing", "crates/baud-app/tests/version.rs::a_dirty_tree_says_so", "crates/baud-app/tests/version.rs::no_git_is_unknown", "crates/baud-app/tests/version.rs::every_answer_is_valid_semver", "crates/baud-app/src/version.rs::main_answers_before_it_starts_anything", "crates/baud-app/src/pty.rs::the_environment_names_what_xtversion_reports", "crates/baud-core/tests/xterm/keypad_version.rs::xtversion_names_what_the_embedder_tells", "crates/baud-app/src/film/chrome.rs::the_name_of_the_build_is_at_the_left_and_yields_before_the_lights", "crates/baud-present-macos/src/about.rs::a_frame_lasts_its_delay_and_the_film_comes_round", "crates/baud-present-macos/src/about.rs::the_age_is_in_appkits_words_and_never_ahead", "crates/baud-app/src/version.rs::no_age_without_a_commit_and_its_time", "crates/baud-app/tests/version.rs::the_commit_time_is_read_from_git", "crates/baud-app/tests/version.rs::the_commit_time_is_told_by_the_flake", "crates/baud-app/tests/version.rs::the_flake_says_the_commit", "crates/baud-app/tests/about_window.rs::the_picture_sits_beside_the_lines_round_and_off_the_film", "crates/baud-app/tests/about_window.rs::the_block_is_centred_for_a_long_and_a_short_version", "crates/baud-app/tests/about_window.rs::the_films_move_only_where_the_pause_is", "crates/baud-app/tests/about_window.rs::a_click_on_the_picture_opens_its_profile", "crates/baud-app/tests/about_window.rs::the_age_is_worked_out_at_each_open_and_only_with_a_commit", "crates/baud-app/tests/about_window.rs::the_bare_window_has_neither_picture_nor_age"]
rows = ["vt:`CSI > 0 q`"]
paths = ["crates/baud-app/build.rs", "crates/baud-app/src/build_id.rs", "crates/baud-app/src/version.rs", "crates/baud-app/src/about.rs", "crates/baud-present-macos/src/about.rs"]

[[feature]]
id = "credits"
area = "window"
name = "Credits for what baud carries"
does = "`baud --credits` prints the notices of every third-party work the program carries -- its fonts, each of the icon font's icon sets on its own, the Unicode data and other tables built into it, and the code ported into it from other projects -- with each one's copyright, what was changed and its licence, then each licence text once, with the copyright notices of every work under it, and exits without opening a window or touching your configuration. THIRD_PARTY.md carries the same notices first. On macOS, the About window's Acknowledgements link, a button the keyboard and VoiceOver reach, opens THIRD_PARTY.md on GitHub at the build's own commit, or its release's tag for a build with no commit history, and its tooltip names `baud --credits` for reading them offline."
status = "built"
platform = "both"
tests = ["crates/baud-app/tests/credits.rs::credits_prints_the_file_and_touches_nothing", "crates/baud-app/src/credits.rs::only_credits_first_asks", "crates/baud-app/src/credits.rs::it_prints_the_file_exactly_and_a_closed_pipe_is_fine", "crates/baud-app/src/credits.rs::main_answers_before_it_starts_anything", "crates/xtask/tests/credits.rs::the_committed_file_is_the_generated_one", "crates/xtask/tests/credits.rs::an_include_with_no_row_fails", "crates/xtask/tests/credits.rs::every_embedded_rows_notice_and_licence_is_in_the_file", "crates/xtask/tests/credits.rs::the_size_tripwire_fires_and_says_where", "crates/xtask/tests/credits.rs::code_a_build_writes_is_followed_to_what_it_read", "crates/xtask/tests/credits.rs::every_input_a_build_says_it_reads_is_followed", "crates/xtask/tests/credits.rs::every_transcribed_row_is_in_the_file", "crates/xtask/tests/credits.rs::each_permission_text_is_printed_once_with_every_copyright_line_above_it", "crates/xtask/tests/credits.rs::third_party_md_and_the_notices_file_carry_one_set_of_notices", "crates/baud-app/tests/about_window.rs::the_acknowledgements_line_is_a_button_that_names_the_offline_route", "crates/baud-app/tests/about_window.rs::the_acknowledgements_line_opens_third_party_md_at_the_build"]
