[[feature]]
id = "program-notifications"
area = "programs"
name = "Notifications and progress bars from programs"
does = "A build or a long command can post a desktop notification when it finishes, with a title, a body and buttons, shown while baud's window is in the background or whenever the program asks; and it can show a progress bar, in the Dock on macOS. A flood of them is held to four at once and then one a second, and `[screen] notifications = \"off\"` turns them off."
status = "partial"
gap = "on Linux a program's icon shows only as a PNG, not yet as a JPEG or GIF; iTerm2's attention fireworks are not drawn; and on macOS a program that asks hears a notification went out before you have allowed them."
platform = "both"
tests = ["baud-core/tests/notifications.rs::kittys_examples_post_what_they_say", "baud-core/tests/notifications.rs::the_query_answers_what_the_embedder_delivers", "baud-app/src/notify.rs::the_macos_driver_makes_the_calls_the_plan_says", "baud-app/src/bus.rs::notifications_marshal_as_dbus_next_marshals_them"]
rows = ["vt:`OSC 9 ; Pt`", "vt:`OSC 9 ; 4 ; st ; pr`", "vt:`OSC 777 ; notify ; title ; body`", "vt:`OSC 99 ; metadata ; payload`", "vt:`OSC 1337 ; RequestAttention=Pv`"]
chips = ["kitty desktop notifications"]
shipped = ["SQ-v1.0-09"]

[[feature]]
id = "iterm2-messages"
area = "programs"
name = "Programs written for iTerm2"
does = "A program or shell script written for iTerm2 can change the cursor's shape, erase the history, tell the title which folder and host it is in, copy text to the clipboard, recolour the text, the background, the cursor, the selection and the sixteen colours, ask for your attention, ask how big a cell is, highlight the row the cursor is on, mark a line that Cmd-Up and Cmd-Down stop at, show PNG, JPEG and GIF pictures inline, as `imgcat` sends them, an animated GIF playing, post a notification, switch to Unicode 8's character widths, ask which features baud has, show a badge, a large faint label such as the host or the branch in the top right behind the text, and set user variables, whose values baud never sends back to a program that asks, so a remote program cannot read what your shell set. A message that would bring the window to the front, switch your settings or upload your files is refused."
status = "partial"
gap = "A badge shows its text and the values of user variables, not the rest of iTerm2's expressions, and has no outline. iTerm2's pictures in formats other than PNG, JPEG and GIF, file downloads, a notification's subtitle and picture, annotations, foldable blocks and Touch Bar labels are not built yet."
platform = "both"
tests = ["baud-core/tests/iterm.rs::cursor_shape_sets_the_shape_and_keeps_the_blink", "baud-core/tests/iterm.rs::current_dir_and_remote_host_name_the_directory", "baud-core/tests/iterm.rs::copy_puts_the_text_on_the_clipboard", "baud-core/tests/iterm.rs::set_colors_sets_each_colour_named", "baud-core/tests/iterm.rs::set_user_var_is_kept_and_reported_empty", "baud-core/tests/iterm.rs::set_mark_is_a_line_the_prompt_jumps_stop_at", "baud-core/tests/notifications.rs::iterm2_notification_posts_its_title_and_message", "baud-core/tests/iterm.rs::unicode_version_selects_the_width_tables", "baud-core/tests/iterm_file.rs::an_inline_png_is_placed_at_its_own_size", "baud-core/tests/iterm.rs::capabilities_report_what_baud_does_now", "baud-core/tests/iterm.rs::every_key_not_acted_on_is_counted", "baud-core/tests/iterm.rs::highlight_cursor_line_shows_and_hides_the_guide", "baud-core/tests/iterm.rs::set_badge_format_keeps_the_format_and_refuses_a_call"]
rows = ["vt:`OSC 1337 ; CursorShape=N`", "vt:`OSC 1337 ; ClearScrollback`", "vt:`OSC 1337 ; CurrentDir=dir`, `OSC 1337 ; RemoteHost=user@host`", "vt:`OSC 1337 ; ReportCellSize`", "vt:`OSC 1337 ; ReportVariable=base64`", "vt:`OSC 1337 ; Copy=:base64`", "vt:`OSC 1337 ; SetColors=key=value`", "vt:`OSC 1337 ; SetUserVar=name=base64`", "vt:`OSC 1337 ; SetMark`", "vt:`OSC 1337 ; Notification=title=base64;message=base64`", "vt:`OSC 1337 ; UnicodeVersion=n`", "vt:`OSC 1337 ; File=args, MultipartFile, FilePart, FileEnd`", "vt:`OSC 1337 ; Capabilities`", "vt:`OSC 1337 ; HighlightCursorLine=yes|no`", "vt:`OSC 1337 ; SetBadgeFormat=base64`"]
roadmap = ["F1-67"]

