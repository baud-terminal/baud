k.rs::an_osc8_link_comes_first_and_a_cell_belongs_to_one_link", "crates/baud-app/src/link.rs::every_rules_link_shows_its_address_in_the_bar", "crates/baud-app/src/lined.rs::a_scheme_a_rule_adds_gets_a_line_at_rest", "crates/baud-app/src/lined.rs::decrqcra_answers_the_same_with_a_rules_line_up", "crates/baud-app/src/lined.rs::both_drivers_hand_both_copies_of_the_rules", "crates/baud-app/src/config.rs::link_rules_read_whole_from_the_config", "crates/baud-app/src/config.rs::the_examples_link_rules_read_uncommented", "crates/baud-app/src/config.rs::the_guide_lists_a_link_rules_keys", "crates/baud-app/src/opener.rs::an_ended_opener_is_reaped_and_a_running_one_kept"]
