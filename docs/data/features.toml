[[feature]]
id = "syllable-columns"
area = "text"
name = "Hindi lines up with your shell"
does = "Hindi and the other Indic scripts, and Thai's and Lao's SARA AM, take the columns Linux shells, editors and other programs built on the C library count -- a column for each letter and each spacing vowel sign -- so the cursor stays where they expect, each Hindi word drawn whole across its columns and any other syllable across its own. Some editors and width libraries agree for Hindi, but count no column for vowel signs such as Tamil's ா and Bengali's া, which baud gives one. For the Mac's own shells and multiplexers that count a vowel sign as no column, one setting does the same; a program that asks for grapheme cluster mode gets a syllable in one cell."
status = "partial"
gap = "a syllable a line wraps inside is drawn as two halves; on a line a program has set to run right to left its cells are drawn one at a time; on a double-width or double-height line each syllable is centred in its own columns; a syllable outside Hindi wider than its columns overlaps the next."
platform = "both"
tests = ["crates/baud-core/tests/syllable_columns.rs::the_cursor_lands_where_glibc_counts", "crates/baud-core/tests/syllable_columns.rs::with_spacing_marks_joined_the_cursor_lands_where_the_mac_shells_count", "crates/baud-core/tests/syllable_columns.rs::grapheme_cluster_mode_is_a_switch_reset_by_both_resets", "crates/baud-present-macos/tests/cells.rs::a_syllable_draws_alike_on_every_arm", "crates/baud-app/src/config.rs::join_spacing_marks_is_off_unless_on"]
