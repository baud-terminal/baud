area = "programs"
status = "done"
date = "2026-10-15"
title = "Side margins are finished, VT420-style"
summary = "Text written past the right margin's corner goes where a VT420 and xterm put it, completing side margins: rectangle scrolling, line starts, cursor moves and the corner all follow DEC's text. The reference terminal now agrees on every case tested, at no speed cost."

[[item]]
