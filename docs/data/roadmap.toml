[[item]]
id = "2026-10-16-the-old-terminal-id-request-answers"
area = "programs"
status = "done"
date = "2026-10-16"
title = "The old terminal-ID request answers"
summary = "Programs that identify the terminal with ESC Z, the VT100's original request, now get the same answer as the modern one; VT52 mode keeps its own reply."

[[item]]
id = "2026-10-16-keypad-arrows-reach-kitty-protocol-programs"
area = "input"
status = "done"
date = "2026-10-16"
title = "Keypad arrows reach programs that ask for every key, on Linux"
summary = "With NumLock off, the keypad's arrows, Home, End, Page Up/Down, Insert, Delete and the centre key are sent as kitty's own keypad keys, or as the keys they stand for in older modes. A Mac keyboard has no NumLock, so on macOS the keypad still types digits."

[[item]]
id = "2026-10-16-a-refused-picture-file-no-longer"
area = "images"
status = "done"
date = "2026-10-16"
title = "A refused picture file no longer pushes out older pictures"
summary = "When a PNG sent as a file can't be placed, older pictures waiting to be placed stay, exactly as when the file is missing, so the reply reveals nothing about your files."

[[item]]
id = "2026-10-16-background-pictures-show-through-tinted-glass"
area = "images"
status = "done"
date = "2026-10-16"
title = "Background pictures show through tinted glass"
summary = "On the see-through window, a bottom-layer picture now shows dimmed through coloured cells, the way the desktop does, and a cell painted the same colour as the default background shows it like a plain cell. Both are your picks; frames without such a picture cost nothing extra."

[[item]]
id = "2026-10-16-picture-files-can-t-be-used"
area = "images"
status = "done"
date = "2026-10-16"
title = "Picture files can't be used to probe your disk"
summary = "A program asking the terminal to show a picture from a file gets the same single error whatever went wrong -- missing, unreadable, not a picture, or refused after reading -- and the terminal ends up in the same state either way, as the kitty protocol requires. Temporary picture files are deleted only inside the folder that was checked."

[[item]]
id = "2026-10-16-pictures-through-tmux-stay-put-while"
area = "images"
status = "done"
date = "2026-10-16"
title = "Pictures through tmux stay put while scrolling"
summary = "During a smooth scroll, the row sliding off the top keeps drawing its placeholder picture instead of blinking out, on every drawing path. Placeholder pictures are now complete: your picks settled how a missing picture and its position marks behave."

[[item]]
id = "2026-10-16-background-pictures-sit-behind-coloured-text"
area = "images"
status = "done"
date = "2026-10-16"
title = "Background pictures sit behind coloured text"
summary = "A program can put a picture on the very bottom layer, so it shows only where text has the plain background and stays hidden behind coloured cells, the selection and the cursor, as the kitty protocol describes. Drawn the same on every drawing path."

[[item]]
id = "2026-10-16-a-picture-that-can-t-be"
area = "images"
status = "done"
date = "2026-10-16"
title = "A picture that can't be placed says so"
summary = "When the terminal has no room for another picture placement, the program now gets an error it can act on instead of being told the picture is up."

[[item]]
id = "2026-10-16-even-more-picture-memory-goes-back"
area = "images"
status = "done"
date = "2026-10-16"
title = "Even more picture memory goes back"
summary = "A Sixel picture that is refused, moved or cut off now gives its memory back too: a refused full-window picture leaves 0.25 MB above idle, where it left 8.6 MB. Memory shared by two neighbouring pictures goes back once both are gone."

[[item]]
id = "2026-10-16-kitty-pictures-work-through-tmux"
area = "images"
status = "done"
date = "2026-10-16"
title = "Pictures work through tmux"
summary = "Programs can show a picture as special placeholder characters, which tmux and other multiplexers pass along as ordinary text, so the picture moves, scrolls and copies with the text around it. kitten icat --unicode-placeholder places pixel-exact, on every drawing path. Every picture size kitten allows is exact, where a full-screen picture used to lose most of its position marks."

[[item]]
id = "2026-10-16-deleting-a-picture-gives-its-memory"
area = "images"
status = "done"
date = "2026-10-16"
title = "Deleting a picture gives its memory back"
summary = "After a full-window picture is shown and deleted, the terminal falls back to within 0.3 MB of its idle memory, where 19.5 MB (a PNG) or 8.4 MB (raw pixels) used to stay. The next picture takes about 0.3 ms longer per 8 MB to write. Measured on macOS; the Linux half is built but not yet run."

[[item]]
id = "2026-10-16-the-character-grouping-rules-can-no"
area = "text"
status = "done"
date = "2026-10-16"
title = "The character-grouping rules can no longer disagree with themselves"
summary = "The machine that decides where one on-screen character ends and the next begins kept its state in two forms that could drift apart. They are now two separate types, so neither can be built out of step with the other; the text path runs slightly fewer instructions as a result and draws exactly the same cells."

[[item]]
id = "2026-10-16-kitty-pictures-can-be-sent-as"
area = "images"
status = "done"
date = "2026-10-16"
title = "Pictures can be sent as files"
summary = "Programs on the same machine can hand baud a picture as a file path, a temporary file or shared memory instead of sending its bytes through the terminal. Only regular files are read, never anything under /proc, /sys or /dev, a file swapped mid-read is refused, temporary files are removed only from a temp folder, and every failure looks the same to the program."

[[item]]
id = "2026-10-16-raw-pixel-kitty-pictures-arrive-ten"
area = "images"
status = "done"
date = "2026-10-16"
title = "Raw-pixel pictures arrive ten times faster"
summary = "Picture data is now read in bulk instead of a byte at a time: a full-window raw picture takes under 5 ms instead of 46, and a full-window PNG 13 ms instead of 18, since its first data block is also checked once instead of twice."

[[item]]
id = "2026-10-16-the-cursor-trail-and-see-through"
area = "cursor"
status = "done"
date = "2026-10-16"
title = "The cursor trail and see-through text match on CPU and GPU"
summary = "The cursor trail and text in a semi-transparent colour could be one shade apart between the CPU and GPU drawing paths; both now round the same way and the pixel comparison checks them. Drawing over the see-through window got about half a percent cheaper."

[[item]]
id = "2026-10-16-kitty-pictures-are-cropped-scaled-and"
area = "images"
status = "done"
date = "2026-10-16"
title = "Pictures are cropped, scaled and layered as asked"
summary = "Pictures now show just the part a program asks for, scaled into the cells it names without distortion, offset inside their first cell, and under the text when asked. They clip at a scroll region's edge as text does. The CPU and both GPU paths draw the same pixels."

[[item]]
id = "2026-10-16-full-window-pictures-fit-at-no"
area = "images"
status = "done"
date = "2026-10-16"
title = "Full-window pictures fit, at no cost when idle"
summary = "Image memory is now only used once a picture is written into it, so the default holds three 4K screens while an idle terminal stays at about 12 MB instead of 111. Queries from programs testing for picture support are always answered and never remove a stored picture."

[[item]]
id = "2026-10-16-generated-text-tables-are-checked-against"
area = "text"
status = "done"
date = "2026-10-16"
title = "Generated text tables are checked against their generators"
summary = "A tool that rebuilds the grapheme-cluster table had been writing one wrong byte since August; the shipped table was right. The tool is fixed and the test suite now fails if either generated table drifts from its source."

[[item]]
id = "2026-10-16-kitty-s-image-protocol-works"
area = "images"
status = "done"
date = "2026-10-16"
title = "Pictures from image tools such as kitten icat and yazi"
summary = "Programs that show pictures the kitty way, such as kitten icat, can now send raw or PNG pictures in pieces, place, replace and delete them, and get answers to their queries. Large pictures decode between frames, so typing never stalls; on Linux too. When image memory fills, the oldest pictures not on screen make room. Cropping, scaling and layering are drawn in a later step."

[[item]]
id = "2026-10-16-png-decoding-three-times-faster"
area = "images"
status = "done"
date = "2026-10-16"
title = "PNG decoding three times faster"
summary = "Checksums, unfiltering and copying now work on many bytes at once: a full-window picture decodes in 11 ms instead of 30, and a 4K picture in 150 ms instead of 232."

[[item]]
id = "2026-10-16-linux-and-macos-give-the-same"
area = "platforms"
status = "done"
date = "2026-10-16"
title = "Linux and macOS give the same shade over the see-through window"
summary = "Both systems now round colours through one shared function; before, about half of all colour and transparency combinations came out one step darker on Linux."

[[item]]
id = "2026-10-16-png-decoding-14-faster"
area = "images"
status = "done"
date = "2026-10-16"
title = "PNG decoding 14% faster"
summary = "Compressed image data now decodes through lookup tables built at compile time; a full-window picture takes 32 ms instead of 37, and 4K pictures 233 ms instead of 284. Large pictures will decode in the background between frames, so the terminal never stalls on one."

[[item]]
id = "2026-10-16-pictures-over-the-see-through-window"
area = "images"
status = "done"
date = "2026-10-16"
title = "Pictures over the see-through window look the same on every drawing path"
summary = "Text, cursors and semi-transparent pictures drawn over the translucent window now get identical colours from the CPU and GPU paths (they differed by up to 47 per channel), following the W3C compositing rule. This matters most on Linux, which draws on the CPU."

[[item]]
id = "2026-10-15-images-can-be-partly-transparent-and"
area = "images"
status = "done"
date = "2026-10-15"
title = "Images can be partly transparent, and decode as they arrive"
summary = "Pictures with soft edges and shadows now blend over your text instead of being drawn solid, while opaque pictures and Sixel images cost the same as before. PNG decoding is 12% cheaper and can resume between reads, ready for kitty's image protocol, which sends pictures in pieces."

[[item]]
