status = "done"
date = "2026-10-15"
title = "Fire and UFO cursor blinks"
summary = "Two more blink animations: the cursor burns down into embers and relights, or a little beam lifts it away and sets it back. Set [cursor] blink_animation to \"fire\" or \"ufo\"; plasma stays the default."

[[item]]
id = "2026-10-15-cursor-up-and-down-stop-at"
area = "programs"
status = "done"
date = "2026-10-15"
title = "Cursor up and down stop at the scroll margins"
summary = "Inside a scrolling region, cursor up and down now stop at its edge, as DEC's text, xterm and ghostty do."

[[item]]
id = "2026-10-15-brackets-take-the-script-of-the"
area = "text"
status = "done"
date = "2026-10-15"
title = "Brackets take the script of the text around them"
summary = "A bracket pair inside Hebrew, Arabic or Greek text is shaped with that text's script, as Unicode's script rules ask, so brackets no longer split a word's shaping."

[[item]]
id = "2026-10-15-the-cursor-blinks-evenly-with-a"
area = "cursor"
status = "done"
date = "2026-10-15"
title = "The cursor blinks evenly, with a plasma glow"
summary = "333 ms on and 333 ms off, glowing like the plasma trail while it is off. [cursor] blink_animation picks fade or a plain blink, blink_interval_ms sets the speed, and Reduce Motion always uses the plain blink."

[[item]]
id = "2026-10-15-new-lines-and-cursor-moves-stay"
area = "programs"
status = "done"
date = "2026-10-15"
title = "New lines and cursor moves stay inside side margins"
summary = "With left and right margins set, as in a vertical split, a new line starts at the left margin and cursor moves stop at the margins, as DEC's VT420 does."

[[item]]
id = "2026-10-15-text-being-composed-follows-the-wide"
area = "text"
status = "done"
date = "2026-10-15"
title = "Text being composed follows the wide setting"
summary = "Under the East Asian wide setting, text you are still composing with an input method takes the width the terminal will give it."

[[item]]
id = "2026-10-15-a-setting-makes-east-asian-ambiguous"
area = "text"
status = "done"
date = "2026-10-15"
title = "A setting makes East Asian ambiguous characters two columns wide"
summary = "Set [text] ambiguous_width = \"wide\" and characters like ±, α and ① take two columns, as CJK fonts draw them. Nerd Font icons stay one column so prompts stay aligned. Programs can ask for the setting with ?1021."

[[item]]
id = "2026-10-15-programs-can-control-how-sixel-pictures"
area = "images"
status = "done"
date = "2026-10-15"
title = "Programs can control how Sixel pictures scroll, share colours and place the cursor"
summary = "The display, shared-colour and cursor-beside-image modes work as DEC and xterm define, and programs can ask how many colours and pixels are available. Colours a picture never defines now take the text colour, as the DEC standard says."

[[item]]
id = "2026-10-15-interlaced-png-images-now-decode"
area = "images"
status = "done"
date = "2026-10-15"
title = "Interlaced PNG images now decode"
summary = "baud's PNG reader handles interlaced images, which the PNG standard requires of every reader. It matches ImageMagick on all 155 interlaced images on this Mac, and ordinary PNGs decode about 1% faster."

[[item]]
id = "2026-10-15-hebrew-vowel-points-now-sit-on"
area = "text"
status = "done"
date = "2026-10-15"
title = "Hebrew vowel points now sit on their letters in fonts without positioning data"
summary = "Each point is placed above, below or beside its letter the way HarfBuzz places it. On one test font the result now matches HarfBuzz on every cluster, up from 19 of 70."

[[item]]
id = "2026-10-15-hebrew-ligatures-now-form-in-apple"
area = "text"
status = "done"
date = "2026-10-15"
title = "Hebrew ligatures now form in Apple fonts such as Lucida Grande"
summary = "Apple-format font tables are now read in the order the font asks for in right-to-left text. The eight Hebrew fonts on macOS now match HarfBuzz on every test cluster."

[[item]]
id = "2026-10-15-wrapped-lines-re-wrap-correctly-after"
area = "scroll"
status = "done"
date = "2026-10-15"
title = "Wrapped lines re-wrap correctly after a resize"
summary = "A line is marked as wrapped only when its text really ran past the edge, whatever way the output arrived. The fix also costs a little less work per line than the first version."

[[item]]
id = "2026-10-14-the-terminal-remembers-where-you-scrolled"
area = "scroll"
status = "done"
date = "2026-10-14"
title = "The terminal remembers where you scrolled to"
summary = "Your place in the history is kept through output, resizes and clears, and returns to the live screen when the program redraws that line or you clear the history."

[[item]]
id = "2026-10-14-reverse-video-swaps-every-cell-s"
area = "window"
status = "done"
date = "2026-10-14"
title = "Reverse video swaps every cell's colours"
summary = "With the reverse-screen mode on, foreground and background swap on every cell, including cells with explicit colours, as the DEC standard says."

[[item]]
id = "2026-10-14-the-bell-now-rings-on-macos"
area = "window"
status = "done"
date = "2026-10-14"
title = "The bell now rings on macOS"
summary = "A bell sounds when the window is focused. When it is not, programs can ask for the Dock icon to bounce or for the window to come forward. A config option picks sound, flash or none, and flash is off under Reduce Motion."

[[item]]
id = "2026-10-14-large-sixel-images-are-decoded-as"
area = "images"
status = "done"
date = "2026-10-14"
title = "Large Sixel images are decoded as they arrive"
summary = "Sixel previews, such as yazi photo and PDF previews, no longer hit a fixed body size limit. The limit is now the image's pixel size. Before this, a few were refused and showed blank, and a stopgap raised the cap to 3 MiB first."

[[item]]
id = "2026-10-14-programs-can-now-change-the-terminal"
area = "programs"
status = "done"
date = "2026-10-14"
title = "Programs can now change the terminal's width and ask for it"
summary = "The 80/132 column switch resizes the window when the program allows it, and the width request sequence is answered."

[[item]]
id = "2026-10-14-cell-clusters-survive-long-documents"
area = "text"
status = "done"
date = "2026-10-14"
title = "Cell clusters survive long documents"
summary = "The store for accented and joined characters now holds 1024 clusters and reuses slots that are no longer on screen. A pointed Hebrew Genesis passage that lost 45 marks now loses none."

[[item]]
id = "2026-10-14-a-baud-opened-from-the-dock"
area = "platforms"
status = "done"
date = "2026-10-14"
title = "A baud opened from the Dock starts your shell in your home folder"
summary = "It no longer reads a config.toml from whatever folder it started in. Relative font and theme paths are read beside the config file."

[[item]]
id = "2026-10-14-rendition-colours-no-longer-change-on"
area = "programs"
status = "done"
date = "2026-10-14"
title = "Rendition colours no longer change on text already on screen"
summary = "When a program uses very many distinct colour and style combinations, the terminal frees unused ones before reusing any, so existing text keeps its colour. Before this, a cell could pick up another cell's colour."

[[item]]
id = "2026-10-14-glyphs-too-complex-to-draw-show"
area = "text"
status = "done"
date = "2026-10-14"
title = "Glyphs too complex to draw show a placeholder instead of nothing"
summary = "A glyph over the point budget now falls back to the next font that has it, then to the font's missing-glyph box, as Unicode requires."

[[item]]
id = "2026-10-14-several-reset-and-cursor-save-sequences"
area = "programs"
status = "done"
date = "2026-10-14"
title = "Several reset and cursor-save sequences now behave as the standard says"
summary = "A soft reset leaves the cursor where it is. DECALN resets margins and origin mode. CSI s and CSI u with a parameter are no longer taken as save and restore. HT and BS respect side margins."

[[item]]
id = "2026-10-13-baud-requires-macos-26-and-says"
area = "platforms"
status = "done"
date = "2026-10-13"
title = "baud requires macOS 26 and says so on older systems"
summary = "On macOS older than 26, baud prints a clear message and exits instead of crashing."

[[item]]
id = "2026-10-13-side-margins-and-scroll-regions-follow"
area = "programs"
status = "done"
date = "2026-10-13"
title = "Side margins and scroll regions follow DEC's rules"
summary = "Origin mode counts from the margins. A zero bottom margin means the last line. Scrolls under side margins move only the rectangle."

[[item]]
id = "2026-10-13-each-script-is-shaped-with-its"
area = "text"
status = "done"
date = "2026-10-13"
title = "Each script is shaped with its own font rules"
summary = "Hebrew, Arabic, Indic and other scripts now use their own OpenType tables, falling back to the default set as the standard says. One replacement character is drawn per bad byte group."

[[item]]
id = "2026-10-12-more-variable-and-cff2-fonts-load"
area = "text"
status = "done"
date = "2026-10-12"
title = "More variable and CFF2 fonts load and draw correctly"
summary = "CFF2 outlines are read with their variation blends, and a damaged CFF2 face is refused at load. Several glyph placement fixes matched HarfBuzz on edge cases."

[[item]]
id = "2026-10-12-three-more-character-sets-draw-correctly"
area = "programs"
status = "done"
date = "2026-10-12"
title = "Three more character sets draw correctly"
summary = "DEC Supplemental, JIS Katakana and JIS Roman are translated, and unused positions draw DEC's error mark."

[[item]]
id = "2026-10-11-osc-52-clipboard-writes-reach-the"
area = "input"
status = "done"
date = "2026-10-11"
title = "Programs can copy to the macOS clipboard"
summary = "Programs can set your clipboard. Reads are still refused. It can be turned off in the config. Input method composition text is drawn at the cursor."

[[item]]
id = "2026-10-09-every-mouse-reporting-mode-works-and"
area = "input"
status = "done"
date = "2026-10-09"
title = "Every mouse reporting mode works, and a fast wheel scroll reaches the program whole"
summary = "The X10, UTF-8, urxvt and SGR pixel modes work. Slow wheel movement adds up, and a slow program no longer freezes the window. Whether scrolling works under a multiplexer is still waiting on your check."

[[item]]
id = "2026-10-09-csi-3-j-clears-saved-history"
area = "scroll"
status = "done"
date = "2026-10-09"
title = "Programs can clear the scrollback"
summary = "Programs can clear scrollback from either screen, and a window scrolled into history returns to the live screen."
