[package]
name = "flashrep"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: this crate is outside baud's and must not join it.
# Assembled in a directory directly under the repository root: this file
# as Cargo.toml, replica-main.rs as src/main.rs, replica-refs.rs as
# src/refs.rs and replica-trailx.rs as src/trailx.rs.
[workspace]

[dependencies]
baud-domain = { path = "../baud-domain" }
baud-font = { path = "../baud-font" }
baud-render = { path = "../baud-render" }

[profile.release]
debug = false
opt-level = 3
