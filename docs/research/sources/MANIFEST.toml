# The Kitty graphics protocol, the second image protocol the Images phase
# covers and the one whose *transmission mediums* are the zero-copy question:
# `APC G <keys> ; <payload> ST`, with `t=d` direct base64, `t=f`/`t=t` a file,
# and `t=s` a POSIX shared-memory object the terminal reads and then
# `shm_unlink`s -- so it is one copy (shm to the image store), not zero, and
# what it saves is the base64, the zlib and the pty chunking rather than the
# copy itself, which `docs/research/notes/t-images.md` records against the
# survey that read the spec. Formats `f=24` RGB, `f=32` RGBA (raw, no decoder)
# and `f=100` PNG (a decoder the `no_std` core cannot carry). Placements are
# separate from images, carry a `z` index (negative below text), and a Unicode
# placeholder (`U+10EEEE`) grid lets an image scroll with text. Design in
# `docs/research/notes/t-images.md`.

