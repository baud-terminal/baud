# The colon underline styles: `CSI 4:0m` none, `4:1` straight, `4:2` double,
# `4:3` curly, `4:4` dotted, `4:5` dashed, with `4m` and `24m` kept for
# backward compatibility, and the rule that the underline colour "must remain
# the same under reverse video, if it has a color, if not, it should follow the
# foreground color". Not in ctlseqs; kitty's extension, adopted by xterm,
# wezterm and foot. **The text layer carries the codes only once tags are
# stripped** -- a grep for `4:3` on the raw HTML reads zero and is a probe that
# cannot fire; `sed 's/<[^>]*>//g'` first, and all six are there.

# What three implementations do with `SGR 21`, cited as **practice** beside
# `ecma48` § 8.3.117's "21 doubly underlined" and "24 not underlined (neither
# singly nor doubly)". The same files as `alacritty-vte-ansi`,
# `linux-vt-console` and `xterm-reset`, under keys scoped to this claim; url,
# file and hash are theirs. vte's `attrs_from_sgr_parameters` maps `[21]` to
# `Attr::CancelBold` (ansi.rs 1849) -- 21 as "bold off", which ECMA-48 does
