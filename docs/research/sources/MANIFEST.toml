# a `table[state][byte]` DFA puts a load on the loop-carried dependency chain:
# the address needs the previous state, so the load cannot issue early. This
# note packs a whole transition row into one word indexed by the *byte*, so the
# load depends only on the input and the loop carries a shift and a mask. It
# also states the cheaper half -- flipping the table to `[byte][state]` takes
# the multiply off the chain -- which is a change baud can make without
# changing its representation at all.

