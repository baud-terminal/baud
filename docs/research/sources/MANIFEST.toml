# Which scrolled lines xterm keeps. `xtermScroll` (util.c 940-1070) saves a
# line to the history when `scroll_all_lines` holds -- the scrollbar widget
# exists, the primary screen is up, and the top margin is the first row
# (948-951) -- and never tests the bottom margin, so the region's height is
# not part of the rule. `scroll_full_line` (952) sends a region narrower than
# the screen to `scrollInMargins`, which keeps nothing. The widget is created
# unrealised at initialisation (charproc.c 11960-11961, `[[source:
# xterm-reset]]`'s file), so the rule holds whether or not a scrollbar is
# shown. `DeleteLine` (1742-1800) also keeps the lines `DL` deletes at row 0,
# called with `canSave` from charproc.c 4020; kitty and wezterm do not.
[sources.xterm-scroll]
key    = "xterm-scroll"
title  = "xterm 411, util.c -- xtermScroll keeps a line when the top margin is row 0"
author = "Thomas E. Dickey"
year   = 2026
venue  = "xterm-snapshots, tag xterm-411 @ 9489b205"
url    = "https://raw.githubusercontent.com/ThomasDickey/xterm-snapshots/9489b2056ee51fa9dd6a7087483b9b8f85d6a0c4/util.c"
file   = "xterm-util.c"
sha256 = "3c3bc4ccc9c11e0946ad84b256fd180db7410256cac568a5a8635cdc902da2b1"
bytes  = 166853
status = "retrieved"
group  = "C"

