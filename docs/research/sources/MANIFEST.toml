# The DFA transition done entirely in a vector register: one `PSHUFB` per byte,
# where the shuffle mask *is* the transition row. By the author of
# `[[source: simdjson]]` and a Hyperscan engine, so it is the shipped form of
# the technique `[[source: dpfsm]]` describes academically. Its constraint is
# the reason to record it precisely rather than from memory: **16 states**, one
# per lane of a 128-bit register, which is a bound baud's 23-state graph
# exceeds and its ground sub-graph does not.

