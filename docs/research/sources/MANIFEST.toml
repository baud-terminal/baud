# --- E: the tty layer ----------------------------------------------------
#
# Group E was declared when the corpus was set up and stayed **empty** while
# `CLAUDE.md` made load-bearing claims about the tty: that `N_TTY_BUF_SIZE`
# caps a Linux `read(2)` at 4095 bytes however large the buffer, that Darwin
# hands back **1024**, that `splice()` "goes through the ldisc ring anyway", and
# that eBPF "cannot skip the `queue_work()` hop". Every one of those was
# *measured* in-repo and *explained* from memory. These are the kernel sources
# the explanations rest on, pinned the way `linux-vt-console` is: one file at
# one commit, so a line number in a note stays a line number.
#
# The Linux files are taken at the **same commit** as `linux-vt-console`, so
# the corpus holds one kernel snapshot rather than four. The XNU files are at
# `xnu-12377.121.6`, the newest tag at retrieval and the Darwin 27 line this
# box runs, so the constants cited are the ones the measurements were taken
# under.
#
# **Reading them corrected a mechanism this repo would have guessed wrong.**
# The obvious explanation for Darwin's 1024 is `TTYHOG`, which is 1024 -- and
# `TTYHOG` bounds the *input* queue, master-to-replica, which is the direction
# an emulator does not read. What bounds a master-side `read(2)` is
# `TTYCLSIZE`, also 1024: `ttymalloc` allocates the replica's output clist at
# that size, `b_to_q` refuses to fill past `c_cn`, and `ptcread` drains it. Same
# number, different constant, and only one of them is on the path -- which is
# what pinning the source rather than the number is for.

