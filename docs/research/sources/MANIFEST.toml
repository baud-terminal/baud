# What a full reset does to the history and the view in foot. `ESC c` is
# `term_reset(term, true)` (vt.c 480-481), and the hard path -- everything past
# `if (!hard) return;` at terminal.c 2147 -- sets both grids' `offset` and
# `view` to zero (2179-2180), erases the first `rows` rows of each (2181-2188)
# and frees every row past them (2189-2196): the history is gone and the view is
# the live screen. xterm and alacritty's `reset_state` agree (`Grid::reset`
# calls `clear_history`); the Linux console and sfte keep the history. **Cited as
# foot's**: one implementation's answer, and the two keys scope the dispatch
# and the body separately because they are two files.
