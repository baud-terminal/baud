# single underline, "No console drivers support double underline" (vt.c
# 1768-1775). xterm's `case 21` sets `ATR_DBL_UNDER` beside `UNDERLINE`
# (charproc.c 4413-4415), so `4;21` holds both there and `24` clears both
# (4437); it has no `4:n`.
