# The Sixel raster grammar, which `ctlseqs` documents the *envelope* of and
# then defers to this manual by name (`xterm-ctlseqs.txt:3234`). It carries
# the parts a decoder implements: the data byte encoding (`?`..`~`, `0x3F`..
# `0x7E`, each carrying six vertical pixels as `value - 0x3F`), the colour
# introducer `#Pc;Pu;Px;Py;Pz` (`Pu` = 1 HLS, 2 RGB), the repeat introducer
# `!Pn`, graphics carriage return `$` and graphics new line `-`, and the
# raster attributes `"Pan;Pad;Ph;Pv`. The grammar characters are text content
# in the HTML and survive `sed 's/<[^>]*>//g'`, unlike `kitty-underlines`'s
# colon codes above.

