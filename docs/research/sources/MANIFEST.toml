# What a full reset does, in xterm, which the rest follow. `ESC c` is
# `CASE_RIS`, which calls `VTReset(xw, True, True)` (charproc.c 6149-6151);
# `DECSTR` calls it with `False, False` (6154-6156). `ReallyReset`'s third
# argument is "clear savedLines" in its own trace line, and with it set
# `screen->savedlines = 0` (14372-14375) -- so RIS empties the scrollback and
# DECSTR keeps it. Its `if (full)` branch holds what DECSTR must not touch:
# the mouse mode and its coordinate encoding (14438-14444), and
# `FromAlternate` beside `ClearScreen` (14503-14504). **Cited as xterm's**: the
# reference implementation `[[source: ctlseqs]]` describes, and one answer.
