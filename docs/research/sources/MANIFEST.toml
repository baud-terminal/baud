# The two standard representation choices stated by an implementer who measured
# them: **premultiplied state identifiers**, which store `i * alphabet_len` in
# the transition so the search needs no multiply, and **byte equivalence
# classes**, which shrink a row from 256 entries to one per class of bytes the
# automaton cannot tell apart. Both are directly available to baud: its states
# are pre-multipliable, and its 256 bytes fall into far fewer classes than 256.
