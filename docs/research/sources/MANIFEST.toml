# The default `[[source: ctlseqs]]` documents `?1036`/`?1039` without stating.
# ctlseqs gives the full truth table at line 2337 and no default for either
# resource, so the choice would otherwise be a remembered one. **Cited as
# foot's, not as xterm's** -- it is one implementation's answer, and the same
# file under a second key because the scope of a citation is the claim it
# carries, not the bytes it lives in.
# **The memory-system source group D was declared and empty.** Every claim this
# repo has made about caches, write amplification and access patterns rested on
# its own benchmark and on argument; the group existed in the legend above with
# nothing in it. This is the first entry, and it went in because an inferred
# mechanism -- "a full-line write avoids the fill a read forces" -- turned out
# to be **wrong on this hardware**: Apple documents the L1D as write-allocate,
# so the store allocates too. A measurement plus a plausible story is how this
# file's other anomalies got their wrong first explanations.
#
# `external`, not `retrieved`: every page is stamped "Registered Developer Use
# Only", so it must not be committed to a public repository. Read and hashed;
# re-fetch from the url and check the sha256 to read it again. The GitHub copy
# is a mirror of Apple's PDF and is cited as such -- Apple's own download at
# developer.apple.com/download/apple-silicon-cpu-optimization-guide/ requires a
# developer login, which is why the mirror is what carries a checkable hash.
# Fetched because a measurement pointed at it. Profiling the gradual erosion
# between `2d23dc8` and `9f6ddc3` on multibench, the largest single step is
# `036a432` -- "Reject overlong UTF-8" -- at about 5%. This paper's Table 13
# prices exactly that work, and puts baud's kind of decoder at 7 instructions
# per byte against the lookup algorithm's 0.21 on ASCII.
