# **The mapping is implemented; this source is not what supplied it.** `gated`
# here means the DEC-authored table was never obtained in machine-readable
# form, which stays true. `[[source: foot-vt100-0]]` carries the same 31
# entries -- the whole of `0x60..0x7E`, which is all the set differs from ASCII
# in -- and is cited as foot's judgement rather than as DEC's. A reader who
# takes this row to mean baud cannot draw a box has read the provenance, not
# the capability.
# Fetched and checked on 2026-08-27: the page returns 200 and carries Table 2-4,
# but the glyphs are **SVG images**, not names -- there is no "HORIZONTAL LINE"
# to map. So the gate is accurate rather than merely stale: no DEC-authored
# source gives a machine-readable byte-to-Unicode mapping, and any table built
# here would be baud guessing what DEC's pictures mean. Implementations have
# one (xterm's `dec2ucs()`, VTE, kitty, foot), but that is their judgement
# rather than the specification, and citing it as DEC would be false.
access = "Published as a figure/image rather than text; no machine-readable mapping obtained."
group  = "C"

