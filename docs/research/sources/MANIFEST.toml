# baud — primary-source retrieval manifest.
#
# One entry per fetched source. url/sha256/bytes/status are FACTS about the
# retrieval: scripts/check-sources.sh re-hashes every retrieved file against
# them, so a source that changed upstream, or was edited locally, fails the
# check suite rather than silently backing a citation it no longer supports.
#
# `status`:
#   retrieved   committed here, and hashes to `sha256`
#   external    read and hash-verified, but NOT committed (licence or size).
#               Citable: it was read.
#   gated       never obtained (paywall / registration); `access` says how.
#               NOT citable — no claim may rest on it.
#
# Notes cite with `[[source: <key>]]`. A claim that matters carries a section
# or page alongside — "simdjson § 3", not "simdjson".
#
# Groups map to docs/research/notes/:
#   A  SIMD parsing and vectorised classification
#   B  data-parallel finite-state machines
#   C  the terminal parser as specified
#   D  memory hierarchy and write amplification
#   E  the tty layer and syscall batching
#   F  text sequence data structures
#   G  text encoding, width and grapheme clustering

