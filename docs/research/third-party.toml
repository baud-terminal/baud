[[tree]]
what     = "Code transcribed from HarfBuzz: morx.rs's extended state machine and its ligature, contextual, insertion and rearrangement subtables (hb-aat-layout-common.hh and hb-aat-layout-morx-table.hh at 64e2b53, two of whose comments it repeats nearly word for word); gvar.rs's delta application, inference loop, tuple scalar and packed point and delta readers (hb-ot-var-gvar-table.hh, hb-ot-var-common.hh and hb-open-type.hh at 12.3.0); and ivs.rs's region scalar, factor(), whose six tests are VarRegionAxis::evaluate's, in its order and with its arithmetic (hb-ot-layout-common.hh:2470-2494 at 12.3.0); shape.rs's fallback mark placement, BaseBox and fallback_marks(), which are position_around_base() and position_mark() of hb-ot-shape-fallback.cc case for case, with the same formulas and tests and four of their comments paraphrased, the Hebrew cases of recategorize_combining_class() there, hb-unicode.hh's modified combining classes 10-26 and compose_hebrew()'s presentation forms (hb-ot-shaper-hebrew.cc), all at 64e2b53; indic.rs's Indic engine, whose initial and final reordering follow hb-ot-shaper-indic.cc's initial_reordering_consonant_syllable() and final_reordering_syllable_indic() step for step with their cluster merges and masks, whose syllable grammar is hb-ot-shaper-indic-machine.rl's productions, and whose dotted circles and vowel sequences are hb-ot-shaper-syllabic.cc's and hb-ot-shaper-vowel-constraints.cc's; syllabic.rs's categories, positions and glyph properties, numbered as hb-ot-shaper-indic-machine.rl and hb-ot-shaper-indic.hh number them; and indic_data.rs, generated by scripts/gen-indic-tables.py, which carries gen-indic-table.py's category and position maps, overrides and matra positions, all at 14.5.1; and, re-expressed in baud's own code, glyf.rs's phantom-point walk, which follows Glyph::get_points()'s phantom_only path step for step (OT/glyf/Glyph.hh at 12.3.0); buffer.rs's deletion at the CHARACTERS cluster level, Buffer::delete(), which passes a deleted glyph's cluster back as delete_glyph() does, with its test that the cluster survives in the next glyph or the glyph before, its backward merge where the deleted cluster is the lower, and its loop over the run before that holds the old cluster, the forward merge left out because at that level merge_clusters() merges nothing (hb-buffer.cc:621-655 at 14.5.1, manifest harfbuzz-14-5-1-buffer-cc); indic.rs's merge(), which at that level merges no cells, as merge_clusters() there only marks the range unsafe to break (hb-buffer.hh at 14.5.1, manifest harfbuzz-14-5-1-buffer-hh); and layout.rs's Digest, hb_set_digest_t as HarfBuzz 10.2.0 builds it (the same shifts in 2.6.4, as hb_set_digest_lowest_bits_t, and 8.0.0), three 64-bit bits-pattern masks at its shifts 4, 0 and 9, with its add, its range test that fills a mask when a range spans 63 or more, and its intersection (hb-set-digest.hh at 10.2.0, manifest harfbuzz-10-2-0-set-digest; read in note BG). The holders those files name are all in HarfBuzz's COPYING, the same file at all three releases"
paths    = ["baud-font/src/morx.rs", "baud-font/src/gvar.rs", "baud-font/src/ivs.rs", "baud-font/src/shape.rs", "baud-font/src/glyf.rs", "baud-font/src/layout.rs", "baud-font/src/indic.rs", "baud-font/src/syllabic.rs", "baud-font/src/indic_data.rs", "scripts/gen-indic-tables.py", "baud-font/src/buffer.rs"]
licence  = "MIT-Modern-Variant"
notice   = "LICENSES/harfbuzz-COPYING.txt"
upstream = "https://github.com/harfbuzz/harfbuzz/tree/12.3.0"
status   = "kept"
public   = "Code transcribed from HarfBuzz (12.3.0, commit 64e2b53 for morx.rs and shape.rs, 10.2.0 for layout.rs, and 14.5.1 for indic.rs, syllabic.rs, indic_data.rs and buffer.rs): morx.rs's extended state machine and its subtables; gvar.rs's delta application and its packed point and delta readers; ivs.rs's region scalar; shape.rs's fallback mark placement and its Hebrew tables; indic.rs's Indic reordering, syllable grammar and dotted circles, syllabic.rs's Indic categories and positions, and indic_data.rs's mapping of the Unicode Indic categories to them; re-expressed, glyf.rs's phantom-point walk; buffer.rs's deletion at the CHARACTERS cluster level, which passes a deleted glyph's cluster back as HarfBuzz's delete_glyph() does; and layout.rs's glyph-set digest"
holder   = "The HarfBuzz authors its COPYING lists (Google, Red Hat, Behdad Esfahbod and others)"
from     = ["https://github.com/harfbuzz/harfbuzz/tree/12.3.0", "https://github.com/harfbuzz/harfbuzz/tree/64e2b53", "https://github.com/harfbuzz/harfbuzz/tree/10.2.0", "https://github.com/harfbuzz/harfbuzz/tree/14.5.1"]

