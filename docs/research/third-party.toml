notice  = "uri"
status  = "nc"
files   = [
  "williams-dec-ansi-parser.html",
]

# Ecma's text copyright policy (manifest ecma-text-copyright-policy and
# ecma-text-copyright-policy-page): its FAQ says the default notice "has
# been included into every new Ecma standard and Technical report since
# 2009. However, we have not retrospectively inserted this copyright notice
# in the older standards. But in practice the same principle also applies
# to them", and that the deliverables under it may be republished "unchanged,
# and up to date". It names "older standards" only; TR/53, a Technical
# Report of 1992, is kept on the reading that the principle covers it too,
# since the policy calls its Standards and Technical Reports alike "Ecma
# deliverables" and says "Ecma publishes specifications which must be
# covered by an Ecma copyright notice". The three files are the current
# edition (for TR/53, manifest ecma-tr53-page), byte for byte what Ecma
# served on 2026-10-28. LICENSES/ecma-copyright-notice.txt carries the
# notice and the answers.
[upstream.ecma]
name    = "Ecma International standards ECMA-35 and ECMA-48 and technical report TR/53, under Ecma's default copyright notice"
licence = "LicenseRef-Ecma-Copyright"
notice  = "LICENSES/ecma-copyright-notice.txt"
status  = "kept"
files   = [
  "ecma-35-6th-1994.pdf",
  "ecma-48-5th-1991.pdf",
  "ecma-tr53-2nd-1992.pdf",
]

