# baud -- the licence of every third-party file in the tree.
#
# scripts/gen-third-party.py reads this file with docs/research/sources/
# MANIFEST.toml and writes THIRD_PARTY.md; scripts/check-sources.sh runs it
# with --check, which fails if:
#
#   - a `retrieved` file in MANIFEST.toml is in no group here, or in two, or a
#     group names a file the manifest does not hold as `retrieved`;
#   - a file in LICENSES/ has no [text] entry, or no longer hashes to it, or an
#     entry names a file that is not there, or a text nothing here cites;
#   - a `notice` or a [[tree]] path names a file that does not exist, or so
#     does a path LICENSE writes from the repository root;
#   - THIRD_PARTY.md is not what this file and the manifest generate.
#
# So a source added to the manifest needs its row here in the same commit.
#
# Fields:
#   licence  an SPDX expression, or LicenseRef-* where SPDX has no identifier:
#              LicenseRef-NoGrant      no grant to redistribute was found
#              LicenseRef-W3C-Document, LicenseRef-IETF-RFC,
#              LicenseRef-Khronos-Specification, LicenseRef-AGG-2.4-permissive,
#              LicenseRef-W3C-Software-and-Document-2023,
#              LicenseRef-Public-Domain-US-Government,
#              LicenseRef-Tektronix-Xcms, LicenseRef-Tektronix-TekHVC,
#              LicenseRef-Ecma-Copyright (Ecma's default copyright notice)
#   notice   where the notice the licence asks for is: a path from the
#            repository root, "in file", "uri" (the licence asks only for its
#            URI, which THIRD_PARTY.md gives), "none needed", or "none"
#   status   kept        redistributable, and its notice is satisfied
#            own         the project's own work
#            nc          kept verbatim under CC BY-NC-SA 3.0, which allows a
#                        verbatim copy that carries its attribution and the
#                        licence's URI; its NonCommercial term binds every
#                        copy of this file, whatever the repository's licence
#            copyleft    redistributable with its licence text, which is in
#                        LICENSES/; keeping it or making it `external` is
#                        open
#            no-grant    no grant to redistribute; moving it out of the tree
#                        (status `external` in the manifest) is open
#            unverified  licence not established; open
#            open        a question recorded where the file is
#   public   what a published crate's NOTICE says the files are, for a reader
#            who has only the crate: no research note, ISO date, decision,
#            hyphenated source key of the manifest, key written as
#            [[source: key]], or repository path (scripts/check-publish.py
#            refuses one); `what`
#            is the row as THIRD_PARTY.md shows it in the repository
#   holder   whose the material is, as the NOTICE names it
#   spdx     what the entry adds to the `license` field of a crate that
#            carries its files, where `licence` is not an SPDX expression
#            crates.io takes (scripts/check-publish.py, SPDX_IDS): "" for
#            facts and protocol interface data, which carry no licence; the
#            licence taken, where the entry is offered under a choice
#   from     the URLs the NOTICE gives, where `upstream` is not one URL; an
#            entry under docs/research/sources/ stands for the URL the
#            manifest records for that file
#
# The classification comes from a read-only audit of the tree on 2026-10-10
# (each file's own header, its upstream repository's licence through the
# GitHub API, or the page's notice), re-checked here for the files added
# since. It is not legal advice.

# ── The licence texts in LICENSES/. `sha256` is the committed file's; the
# check re-hashes it, so a hand edit to a text fails. `needs` lists the texts
# a text names as part of its own notice (macos-man-notices.txt names the
# APSL 2.0 for kqueue(2)): a text cited is a citation of each of those, and
# a crate that carries it carries them too.

