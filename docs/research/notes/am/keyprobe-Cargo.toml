# The key probe of note AM, keyprobe-main.rs. It is not a workspace member.
# Build it in a directory under target/, which git ignores, so that the
# relative path below names this repository's baud-domain. From the
# repository root:
#   mkdir -p target/keyprobe/src
#   cp docs/research/notes/am/keyprobe-Cargo.toml target/keyprobe/Cargo.toml
#   cp docs/research/notes/am/keyprobe-main.rs target/keyprobe/src/main.rs
#   cargo run --offline --release --manifest-path target/keyprobe/Cargo.toml
# Run from the root, the program finds the pinned xterm-256color entry and the
# -x capture where they are committed, under docs/research/sources/terminfo/.
[package]
name = "keyprobe"
version = "0.0.0"
edition = "2021"

[dependencies]
baud-domain = { path = "../../baud-domain" }

[workspace]
