# **The binary's floor is the bundle's: macOS 26.** baud runs on macOS 26
# and later: `packaging/macos/Info.plist` names 26.0, and this makes the
# Mach-O's own minimum (`LC_BUILD_VERSION minos`) say the same.
# `scripts/build-metallib.sh` passes the same release to the Metal
# compiler, `baud-app/build.rs` sets it for the published crate, which
# carries no copy of this file, and `baud-app/tests/macos_floor.rs` holds
# all four equal.
#
# `force`, because the devenv shell already exports
# `MACOSX_DEPLOYMENT_TARGET=14.0` (its nix stdenv's), and an `[env]` entry
# without it yields to the environment: the binary linked at 14.0 with this
# file present. Not `rustflags`: devenv exports `RUSTFLAGS`, which replaces
# every `rustflags` a config file sets (`baud-app/build.rs`). Off macOS
# rustc does not read the variable.
[env]
MACOSX_DEPLOYMENT_TARGET = { value = "26.0", force = true }

# **The repository's gates are a crate, run as `cargo xtask <command>`**
# (`xtask/`): `audit`, `scan-audit`, `changelog`, `features`, `fnv1a`,
# `sources`, `third-party`, `publish` and `page-text`, each run from the
# repository's root; `scripts/check-sources.sh` execs `sources`.
[alias]
xtask = "run -q -p xtask --"
