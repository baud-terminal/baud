[package]
name = "baud-present-vulkan"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "CC-BY-NC-SA-4.0"
repository.workspace = true
description = "baud's Vulkan presentation on Linux: frames drawn into exported dmabufs and shown through baud-present-wayland."
rust-version.workspace = true
# Not published until `baud` depends on it (`xtask`'s `UNPUBLISHED`): the
# Linux driver draws through shared memory today.
publish = false
readme = "README.md"
keywords = ["terminal", "vulkan", "wayland", "linux"]
categories = ["gui", "os::linux-apis"]
include = ["/src/", "/README.md", "/LICENSE"]

[dependencies]
baud-present-wayland = { workspace = true }

# Linux only: the crate is empty elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
# Vulkan's bindings, the loader opened at run time (`loaded`): a box
# without libvulkan runs on shared memory rather than failing to start.
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }

[dev-dependencies]
baud-domain = { workspace = true }
