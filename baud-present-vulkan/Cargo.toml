[package]
name = "baud-present-vulkan"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "CC-BY-NC-SA-4.0 AND Unicode-3.0"
repository.workspace = true
description = "baud's Vulkan presentation on Linux: frames drawn into exported dmabufs and shown through baud-present-wayland."
rust-version.workspace = true
readme = "README.md"
keywords = ["terminal", "vulkan", "wayland", "linux"]
categories = ["gui", "os::linux-apis"]
# What crates.io gets: the source, the shaders the build includes, the
# licence and the notices its third-party files need (`cargo xtask publish`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/shaders/", "/README.md", "/LICENSE", "/NOTICE", "/LICENSES/"]

[dependencies]
baud-present-wayland = { workspace = true }

# Linux only: the crate is empty elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
# Vulkan's bindings; the loader is opened at run time by the crate's own
# dlopen (`loader.rs`): a box without libvulkan runs on shared memory
# rather than failing to start.
ash = { version = "0.38", default-features = false, features = ["std"] }
# The atlas the sheets are brought up to, and the cell path's frame.
baud-render = { workspace = true }
baud-domain = { workspace = true }
# The metrics' pixels, which `CU` carries.
baud-font = { workspace = true }
# The terminal the driver's frames are built from (`present.rs`).
baud-core = { workspace = true }

[features]
# For the crate's tests: a pipeline build held at a gate (`Pipelines::hold_builds`),
# a target cleared and waited for (`Gpu::clear`), and the CPU's fence waits
# counted (`Gpu::waits`). baud's own build leaves it off (`xtask/tests/test_hooks.rs`).
test-hooks = []

[dev-dependencies]
baud-present-vulkan = { path = ".", features = ["test-hooks"] }
baud-core = { workspace = true }
baud-domain = { workspace = true }
baud-font = { workspace = true }
baud-render = { workspace = true }
