[package]
name = "baud-wayland"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "CC-BY-NC-SA-4.0 AND HPND-sell-variant AND MIT"
repository.workspace = true
description = "The Wayland wire protocol spoken over the socket, with the interface tables generated at build time from the pinned protocol XMLs; no libwayland."
rust-version.workspace = true
readme = "README.md"
keywords = ["wayland", "protocol", "client", "linux"]
categories = ["gui", "os::linux-apis"]
# What crates.io gets: the source, what the build reads, the licence and
# the notices its third-party files need (`scripts/check-publish.py`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/build.rs", "/README.md", "/LICENSE", "/NOTICE", "/protocols/"]

[dependencies]
baud-domain = { workspace = true }
