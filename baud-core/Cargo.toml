[package]
name = "baud-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A terminal emulator core: PTY bytes through VT parse into a grid. no_std, allocation-free."

[features]
default = []
# `Storage::boxed`, for hosts that have an allocator. The core itself never
# allocates; this is a convenience for callers who would otherwise have to find
# 24 MB of static storage.
alloc = []
# Ceiling arms. Each is incorrect by construction and off by default; they
# exist so the next person re-measures where the time is instead of arguing
# about it, which is how this crate came to be written at all.
#
# `no-write`   the routes are computed and nothing reaches the grid
# `no-classify` characters are decoded and assumed narrow: prices the
#              128 KB property table lookup, one load a character
# Histograms of how often each bulk path is *entered*, which is the question
# a throughput number cannot answer.
diag = []
ceiling-no-write = []
# The single-character decode stubbed: with `ceiling-no-write` it brackets
# what the per-character path costs on a recording whose runs are one long.
ceiling-no-decode = []
ceiling-no-classify = []
# `probe-double-classify` prices the property lookup by doing it twice.
probe-double-classify = []

[dependencies]
baud-domain = { path = "../baud-domain" }
baud-isa = { path = "../baud-isa" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
baud-isa-x86-64 = { path = "../baud-isa-x86-64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
baud-isa-aarch64 = { path = "../baud-isa-aarch64" }
