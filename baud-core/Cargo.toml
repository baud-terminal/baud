[package]
name = "baud-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A terminal emulator core: PTY bytes through VT parse into a grid. no_std, allocation-free, 92 VT operations."
# no_std, no alloc, no dependencies. storage is caller-provided.

[features]
# `instrument` is on by default so tests and benches get it without asking, and
# an embedder turns it off with `default-features = false`.
#
# Measured cost of the attribution counters it gates: **2-3%** -- streaming
# 1321/1354/1361 against 1385/1396/1400 stripped, btop 451/451/451 against
# 460/459/464. That is the price of the visibility, and the visibility found
# four optimisations worth +40% in one session, so it is a good trade while
# optimising and a bad one in production.
#
# The counters `cells_written`, `bytes_in` and the style-table pair are *not*
# gated: they carry the write-amplification claim the whole architecture rests
# on, and a number that disappears in release is a number nobody checks.
default = ["instrument"]
instrument = []
# **A cost map, not a counter set, and a separate feature because of where it
# lives.** `instrument` counts at run boundaries and costs 2-3%; `diag` counts
# inside the bulk collector's per-character loop and inside `put_cp`, so
# leaving it in the measured build would price the thing being measured. It
# answers *why* a character missed a bulk path, which no profile can: a leaf
# frame names the function that ran, not the characters that reached it.
#
# No throughput figure in this repo is taken with it on.
diag = ["instrument"]
# **A ceiling arm for the block decoder.** Swaps `wide_run`'s const-stride
# decode for `Decode::block`, leaving everything after it identical, so the
# measured difference is the decode alone. Compiled out rather than switched:
# this repo has measured a fake 13-17% from a runtime `if` in a hot loop.
block-decode = []
mixed-decode = []
dep-probe-serial = []
dep-probe-free = []
miss-probe = []
width-probe = []
attach-probe = []
pipeline-decode = []
short-wide = []
ceiling-no-write = []
fast3 = []
ceiling-no-attach = []
ceiling-cheap-emoji = []
merged-trie = []
# **A ceiling arm, not a shipping option.** Makes `fill_row_counted` count and
# not write, so the grid is wrong on purpose: it answers "what would blanking
# cost if it were free" and nothing else. Compiled out rather than switched at
# runtime because this repo has already measured a fake 13-17% from a runtime
# `if` in a hot loop.
ceiling-no-blank = []
alloc = ["zerocopy/alloc"]

[dependencies]
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
baud-domain = { path = "../baud-domain" }
baud-isa = { path = "../baud-isa" }

# **Per-architecture, so a consumer builds only its own.** Cargo resolves these
# by target, which is the packaging half of the reason these are crates rather
# than modules: an aarch64 build never compiles the AVX2 code and vice versa.
[target.'cfg(target_arch = "x86_64")'.dependencies]
baud-isa-x86-64 = { path = "../baud-isa-x86-64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
baud-isa-aarch64 = { path = "../baud-isa-aarch64" }

[dev-dependencies]
proptest = "1"
baud-core = { path = ".", features = ["alloc"] }
