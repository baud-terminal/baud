[package]
name = "baud-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A terminal emulator core: PTY bytes through VT parse into a grid. no_std, allocation-free."

[features]
# **`param3` is off, and it used to be on.** Three bytes an edge in the
# parameter table was +17% on `btop.raw` when `Act::Digit` walked parameters
# through the graph. `fast_esc` and `fast_csi` now take an entire sequence in
# one iteration, so that action is never reached -- it does not appear in any
# recording's histogram at all -- and the table is 1.31 MB of rodata nothing
# reads. Off, it is flat on btop and asciiquarium and **better** on cat-scroll,
# git-log and less-pager, which is the rodata-layout class this file records
# three times.
# **`neon-scan` is on**, and it is the only default feature. It swaps the
# printable and stride-three run scans to `baud-isa-aarch64::Neon`, which
# extracts a lane mask with `shrn` where `core::simd`'s `to_bitmask` lowers to a
# horizontal reduction. Measured **+4.2% on cat-cjk and +4.0% on less-cjk**,
# disjoint from base and from an A/A control in the same sweep and stable under
# reversing the arm order; every other recording overlaps.
#
# **It is inert off aarch64.** The dependencies are target-gated and
# `baud-isa-aarch64` is `#![cfg(target_arch = "aarch64")]`, so on any other
# target the feature pulls nothing and the call sites compile to the portable
# path -- which is why `x86_64-unknown-none` still builds and still forbids
# `unsafe`.
#
# **To A/B it, `--no-default-features` must be passed to the crate that depends
# on this one, and `baud-bench` sets `default-features = false` for exactly
# that.** `cargo build -p baud-bench --no-default-features` disables *that*
# crate's defaults, not a dependency's, and the first attempt at this comparison
# silently rebuilt nothing and measured a cached binary against itself. The
# check that catches it is one `objdump`: no `shrn` in `main` means the arm is
# off.
default = ["neon-scan"]
# `Storage::boxed`, for hosts that have an allocator. The core itself never
# allocates; this is a convenience for callers who would otherwise have to find
# 24 MB of static storage.
alloc = []
# Ceiling arms. Each is incorrect by construction and off by default; they
# exist so the next person re-measures where the time is instead of arguing
# about it, which is how this crate came to be written at all.
#
# `no-write`   the routes are computed and nothing reaches the grid
# `no-classify` characters are decoded and assumed narrow: prices the
#              128 KB property table lookup, one load a character
# Histograms of how often each bulk path is *entered*, which is the question
# a throughput number cannot answer.
diag = []
ceiling-no-write = []
# The single-character decode stubbed: with `ceiling-no-write` it brackets
# what the per-character path costs on a recording whose runs are one long.
ceiling-no-decode = []
ceiling-no-classify = []
# **The three components of the cluster machine, priced one at a time.**
# The machine cost a third of `cat-cjk` and the first explanation offered for
# it -- the all-or-nothing run gate -- was built and measured at nothing, so
# these exist because attributing a cost is not the same as pricing one.
#
# `is_break_classified`, run twice on a `Copy` so the machine advances once.
# Additive and idempotent: every counter is unchanged, so the delta is the
# call and nothing else.
probe-double-break = []
# The attach path -- the lead resolution, the store lookup and the intern --
# run twice with the first result discarded. `intern` is idempotent on the same
# cluster, so the state and every counter are unchanged.
probe-double-attach = []
# **A ceiling, not a probe**: the run gate always admits, so a run containing a
# ZWJ or a regional indicator is bulk-written as separate characters. Incorrect
# by construction and `cells_written` says so, which makes it an upper bound on
# what the gate's fallback costs rather than a measurement of it.
ceiling-no-run-gate = []
# `probe-double-classify` prices the property lookup by doing it twice.
probe-double-classify = []
# The blank behind a scroll, with the ring still advancing.
ceiling-no-blank = []
# The whole of `Paint::index`: no row change, no rotation, no blank.
ceiling-no-scroll = []
# The per-character row-extent read-modify-write, priced by doing it twice.
probe-double-extent = ["baud-domain/probe-double-extent"]
# Only the two cell stores, with the cursor, wrap, scroll and extent intact.
ceiling-no-store = ["baud-domain/ceiling-no-store"]
# The loop with every action free: lookup, dispatch and run scans only.
ceiling-no-act = []
# The per-character decode, priced by doing it twice.
probe-double-decode = []
# Phase 0: the width taken from a register compare instead of the classify
# load, to price the loop-carried dependency through the cursor.
probe-free-width = []
# Phase 0b: the graph indexed at a constant node, to price the loop-carried
# load-to-load dependence through the node. Exact on a whole-file read.
probe-pinned-node = []
probe-const-stride = ["baud-domain/probe-const-stride"]
# The run scan, priced by doing it twice: 7% of cat-cjk.
probe-double-scan = []
# **Prefetch the row the scroll after the next will blank.** With the grid as
# the scrollback ring, a scroll's blank lands on lines nothing has touched
# for `ring` scrolls, and this hints them a scroll ahead through
# `baud_isa::Warm`. Measured, and it is a loss: `flat` at 2,000 lines of
# depth 2349 -> 3477 (the L2 cliff hidden), and **cat 0.62x, git-log 0.76x at
# every depth** -- the cost scales with the lines hinted (a mark-bounded hint
# is 0.80x, a single line is neutral and hides nothing), so on this core a
# prefetch is not a hint but a load the demand traffic queues behind. Kept as
# the arm that re-measures it; it does nothing without `neon-scan` or
# `avx2-scan`.
probe-warm-scroll = []
# The ASCII-only ingest arm: one 256-entry table, one lookup per byte, no scan.
ascii-only = []
# The write is a lookup: the cell comes from table[b0][b1][b2], not a decode.
cell-table = []
# **The aarch64 run scan through `baud-isa-aarch64::Neon` instead of
# `core::simd`.** Not a width change -- NEON is 128-bit and `LANE_COUNT` is
# already 16. It changes the *extraction*: `to_bitmask` lowers to `addv.8h`, a
# horizontal reduction, where `shrn` carries no serial dependency, and
# disassembling `ingest2` puts 11 `addv.8h` in `main` where `feed` inlines and
# zero `shrn` in baud's own code.
#
# **It is off because it costs `unsafe`.** `Scan`'s methods are `unsafe fn`, and
# this crate is `forbid(unsafe_code)` -- which `lib.rs` drops only under this
# feature, so the default build is unchanged. On aarch64 NEON is baseline, so
# there is nothing to detect and no fallback to pick and the contract is
# satisfied by the target alone; that makes the `unsafe` a formality rather than
# a risk, and a formality is still a policy change the owner owns.
neon-scan = ["dep:baud-isa", "dep:baud-isa-aarch64"]
# **The x86-64 twin, and it is off for two reasons rather than one.**
#
# `scan_avx2` reads 32 bytes a step where `core::simd` reads 16, so unlike the
# NEON arm -- which is the same width and a cheaper extraction -- this one is a
# genuine 2x on the printable run scan. Only that scan: `Avx2::stride_three` and
# `stride_four` delegate to `Portable`, because the contract caps them at five
# and four characters in a sixteen-byte block and a 256-bit register has nothing
# to add to a fifteen-byte question.
#
# **It is unmeasured**, and this repo does not ship unmeasured throughput
# changes. No x86-64 host is available here, and the closest prior is
# discouraging: wiring `Scan::run` alone on aarch64 measured a flat null on all
# nine, because the payloads with long printable runs are store-bound -- `cat`'s
# write path sits at 74% of the machine's vectored-store ceiling, and that
# argument does not depend on the architecture.
#
# **And it needs a build that targets AVX2.** `#[cfg(target_feature = "avx2")]`
# guards it, so `-C target-feature=+avx2` or a `target-cpu` implying it is
# required; without that the call site compiles to the portable path. That gate
# is what lets `baud-core` keep `forbid(unsafe_code)`: AVX2 is not baseline, so
# the trait's `unsafe fn` is a real contract, and the only thing that discharges
# it without runtime detection is the build targeting the feature.
avx2-scan = ["dep:baud-isa", "dep:baud-isa-x86-64"]
# Three bytes an edge in the parameter table instead of two: 1.31 MB of rodata
# against 128 KB, and it takes a three-digit parameter in one step.
param3 = []
# The accelerated CSI path declines every time. **Not a ceiling arm**: the graph
# walks the sequence instead, so the screen is identical and only the route
# differs -- which is what makes it a clean discriminator between the fast path
# and the plumbing that reaches it.
probe-no-fast-csi = []
# The sequence is scanned and its parameters accumulated, and then nothing is
# performed. **`cells_written` is unchanged for an SGR-only payload**, because
# a rendition change writes no cells -- so this is a clean price for dispatch
# and the operation, not a ceiling arm that removes work downstream.
probe-no-csi-op = []
# The parameters are not accumulated: the scan runs, the loop runs, and the
# digits are discarded. Prices the parameter walk inside the fast path.
probe-no-csi-params = []
# The parameter walk run twice into a scratch and discarded: the additive
# counterpart to `probe-no-csi-params`, which also removes the truecolor SGR
# chain and therefore over-prices the walk.
probe-double-params = []
probe-csi-scratch = []
# **The two-pass `CSI` path, kept for A/B.** `final_byte_at` scanned for the
# terminator and the walk then classified the same eight to twelve bytes again;
# one pass does both, because the walk's fallthrough arm *is* the terminator.
# Fusing them is +9.5% asciiquarium, +5.8% vim, +4.7% btop with nothing
# regressing, so the fused form is the default and this restores the old one.
two-pass-csi = []
route-stride = []
# Prices the two-pass terminator scan, so it needs the scan: `final_byte_at`
# is gated behind `two-pass-csi`, which the CSI scan/walk fusion moved it to.
probe-double-final-scan = ["two-pass-csi"]
ceiling-free-sgr = []
ceiling-no-region-copy = []
ceiling-segment-cache = []
# **The byte-keyed `SGR` table, off.** A plain `SGR` is a pure function of
# its bytes and its result is a masked replace of the rendition word, so a
# repeated one can be answered from a 256-slot table keyed on the sequence --
# and `btop.raw` draws 19,984 of them from 168 distinct strings. It is correct,
# it hits 67% of btop's, and it is worth **1.3% against a 4.8% A/A floor**,
# with `less-pager` and `git-log` slightly down. Compiled so the next person
# re-measures rather than rebuilds.
sgr-table = []
# The printable-run scan, priced by running it twice. Same bytes, same answer,
# every counter unchanged -- so it is a marginal cost and not a ceiling.
probe-double-text-scan = []
# The SGR fold priced by doing it twice: same parameters, same result, every
# counter unchanged.
probe-double-sgr = []
probe-sgr-copy = []
probe-double-fold = ["baud-domain/probe-double-fold"]
probe-double-sgr-color = ["baud-domain/probe-double-sgr-color"]
probe-sgr-color-reborrow = ["baud-domain/probe-sgr-color-reborrow"]
colour-in-match = ["baud-domain/colour-in-match"]
# The rendition intern priced by doing it twice.
probe-double-intern = []
probe-double-intern-full = []
# `Csi::parse_with` priced by doing it twice -- the general grammar, which
# every non-SGR sequence goes through.
probe-double-parse = []
# The per-character write, priced by doing it twice. `put_glyph_fresh` is
# idempotent, so the counters and the screen are unchanged.
probe-double-put = []
# The text run's bulk writer, so `put_ascii_run` can be priced against the
# per-character path it replaces.
ceiling-no-text = []
# The wide tail not written at all: an upper bound on making it implicit.
ceiling-implicit-tail = []

[dependencies]
baud-domain = { path = "../baud-domain" }

# **Optional, target-gated, and off.** `baud-isa-aarch64` is `#![cfg(target_arch
# = "aarch64")]`, so the dependency cannot exist elsewhere and neither can the
# feature that wants it. See `neon-scan` in `[features]` for what it is for and
# what it costs.
[target.'cfg(target_arch = "aarch64")'.dependencies]
baud-isa = { path = "../baud-isa", optional = true }
baud-isa-aarch64 = { path = "../baud-isa-aarch64", optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
baud-isa-x86-64 = { path = "../baud-isa-x86-64", optional = true }

# **The property suite, and the first dev-dependency this crate has had.**
# `baud-core2` carried 606 tests and all the proptest machinery; this crate had
# 20 tests and no generator at all, and every clustering defect in this repo's
# history was found by something it did not have. Both are this crate's now.
[dev-dependencies]
proptest = "1"
baud-core = { path = ".", features = ["alloc"] }
# **Tests only.** `every_national_replacement_renders_as_its_table_says` reads
# `nrcs_table` so its expectations come from the generated tables rather than
# from a list transcribed into the test -- a transcribed table drifts from its
# source the day the source changes, which is the failure `nrcs_data.rs`'s own
# header warns about. `baud-core` re-exports the types it uses and deliberately
# not the data.
baud-domain = { path = "../baud-domain" }
# Only to key a `HashSet` on a whole `PackedCell`: it is `Eq` but not `Hash`,
# and hashing its eight bytes is exact where a key built from the public
# accessors would silently drop whatever `CellFlags` carries.
zerocopy = "0.8"


