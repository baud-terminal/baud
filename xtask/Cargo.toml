[package]
name = "xtask"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The repository's gates and generators, run as `cargo xtask <command>`."
# Not published: `publish = false`, so `cargo publish` refuses it and
# release-plz leaves it out (`cargo xtask publish`). It is reached
# through the `xtask` alias in `.cargo/config.toml`, and `default-members`
# stays `baud-app`, so a bare `cargo run` still builds the terminal.
publish = false

[dependencies]
# `changelog` reads `release-plz.toml`'s parsers. TOML 1.1 is a superset of
# the 1.0 `tomllib` read, so every file that parsed there parses here.
toml = { version = "1.2.1", features = ["preserve_order"] }
# The audit's categories and the changelog's legs. release-plz and
# git-cliff compile `commit_parsers` with this crate themselves, so the
# changelog gate now reads them with the engine that applies them.
regex = "1.13.1"
# git-cliff's `--context`, read as a `Value`: no derive, no schema.
serde_json = "1.0.154"
# The inflater (`baud-domain/src/zlib.rs`), for the `.crate` gzip the
# publish gate reads once it moves here.
baud-domain = { path = "../baud-domain" }
