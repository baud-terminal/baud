[package]
name = "baud-present-macos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "baud's macOS presentation layer: an IOSurface-backed content view inside a macos-liquid-glass window, display-link pacing, AppKit input."
rust-version.workspace = true
readme = "README.md"
keywords = ["terminal", "macos", "metal", "appkit"]
categories = ["gui", "os::macos-apis", "rendering"]
# What crates.io gets: the source, what the build reads, the licence and
# the notices its third-party files need (`scripts/check-publish.py`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/README.md", "/LICENSE", "/NOTICE", "/LICENSES/"]

[dependencies]
baud-core = { workspace = true, features = ["alloc"] }
baud-domain = { workspace = true }
baud-font = { workspace = true }
baud-render = { workspace = true }

# The `macos-liquid-glass` window crate. The drawable view and the surface
# were added on its `feat/drawable-view` branch and released as
# 1.0.0-beta.5, so this is a version rather than a branch revision -- a
# branch pin is a snapshot that stops receiving the release commits, and it
# named one machine's checkout before that. The requirement must spell the
# pre-release out: a `"1.0"` requirement does not match `1.0.0-beta.5`.
[target.'cfg(target_os = "macos")'.dependencies]
# `newLibraryWithData` takes a `dispatch_data_t`, and
# `DispatchData::from_static_bytes` wraps `include_bytes!` without a copy.
dispatch2 = "0.3"
macos-liquid-glass = { version = "1.0.0-beta.6", features = ["drawable"] }
# Metal, and the two crates the surface-to-texture bridge names. The same
# `objc2` family and versions the window crate pins, so the `IOSurface` it
# hands over is the type these read.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-io-surface = "0.3.2"
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface", "objc2-core-foundation"] }
# The completion handler is a block: the frame is presented when the GPU
# says it is done, and nothing waits for it.
block2 = "0.6"

# The pinned present tests build a real `CALayer`, give it bounds and a
# contents scale, set an `IOSurface` on it and read back *which* surface
# arrived -- all in a plain `cargo test` with no window, no `NSApplication`
# and no run loop. Measured before it was designed around: a probe reported
# `CALayer::new()` succeeding off the main thread, `setBounds` and
# `setContentsScale` round-tripping, and `contents()` distinguishing two
# surfaces by pointer, with and without a `CATransaction`. A dev-dependency
# because nothing in the crate's own path touches a layer -- the window
# crate owns that -- so this is an oracle, the `ttf-parser` shape.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-quartz-core = "0.3.2"
objc2-core-foundation = "0.3"
