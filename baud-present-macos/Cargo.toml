[package]
name = "baud-present-macos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "baud's macOS presentation layer: an IOSurface-backed content view inside the owner's macos-liquid-glass window, display-link pacing, AppKit input."
# Not published: a platform crate for the app, with no crates.io audience.
publish = false

[dependencies]
baud-font = { path = "../baud-font" }
baud-render = { path = "../baud-render" }

# The owner's window crate, extended in place on its `feat/drawable-view`
# branch for the drawable view and the surface; a path until it is released.
[target.'cfg(target_os = "macos")'.dependencies]
macos-liquid-glass = { path = "~/src/test/glassnote", features = ["drawable"] }
