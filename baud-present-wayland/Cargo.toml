[package]
name = "baud-present-wayland"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "CC-BY-NC-SA-4.0"
repository.workspace = true
description = "baud's Wayland presentation layer: a wl_shm window over the pure-protocol connection, xdg-shell, frame pacing on the frame callback, and the keyboard through baud-xkb."
rust-version.workspace = true
readme = "README.md"
keywords = ["terminal", "wayland", "linux"]
categories = ["gui", "os::linux-apis"]
# What crates.io gets: the source, what the build reads, the licence and
# the notices its third-party files need (`scripts/check-publish.py`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
baud-domain = { workspace = true }
baud-wayland = { workspace = true }
baud-xkb = { workspace = true }
