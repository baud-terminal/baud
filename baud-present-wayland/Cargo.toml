[package]
name = "baud-present-wayland"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "CC-BY-NC-SA-4.0"
repository.workspace = true
description = "baud's Wayland presentation layer: a wl_shm window over the pure-protocol connection, xdg-shell, frame pacing on the frame callback, and the keyboard through baud-xkb."
rust-version.workspace = true
readme = "README.md"
keywords = ["terminal", "wayland", "linux"]
categories = ["gui", "os::linux-apis"]
# What crates.io gets: the source, what the build reads, the licence and
# the notices its third-party files need (`cargo xtask publish`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
baud-domain = { workspace = true, features = ["alloc"] }
baud-wayland = { workspace = true }
baud-xkb = { workspace = true }

[features]
# The bytes `Window::present` copies into shared memory, read through
# `Window::copy_counts`; off, the field and its add do not exist.
copy-counts = []

[dev-dependencies]
# `copies_per_mb` (tests/handshake.rs) feeds a recording through the core
# and the CPU renderer before the window presents it.
baud-core = { workspace = true, features = ["alloc", "copy-counts"] }
baud-font = { workspace = true }
baud-render = { workspace = true, features = ["counters"] }
# The window's own copy counts, on for this crate's tests.
baud-present-wayland = { path = ".", features = ["copy-counts"] }
