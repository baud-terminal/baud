# **The deterministic counter gate's baselines** (`scripts/perf-gate.sh`).
#
# Each entry is keyed `[<path>.<input>.<isa>]`: the hot path, the bench
# input that reaches it, and the ISA whose instruction stream was counted.
# Its figures are callgrind's counts inside the path's function, one rep of
# the input: `ir`, instructions, the same at both simulated geometries; and
# per geometry (`d1-64`, `d1-128`, the simulated line size) `d1mw`, D1 write
# misses, `d1mr`, D1 read misses, `llmr`, LL read misses (instruction and
# data), and `llmw`, LL write misses. Each carries its `value`, `set_in` (a
# dated note) and `reason`.
#
# Only `--update` writes a figure. A passing run never moves one. A figure
# that rose or is new is written with the reason the update was given, and
# its commit says why and what was measured; a figure that fell is a
# ratchet and needs only the figure.
#
# The simulated caches are the baseline host's, read from
# /sys/devices/system/cpu/cpu0/cache/index*/: L1d 48 KiB, 12-way, 64 sets
# of 64 B; L3 32 MiB, 16-way, 32768 sets of 64 B (the last level; the 1 MiB
# 16-way L2 is not modelled). Both are simulated at a 64-byte line and again
# at a 128-byte one, the same size and associativity. `d1` and `ll` are
# `<size>,<associativity>`, and the script adds the line.
#
# `rustc` is the compiler the figures were counted from. A different one
# changes the instruction stream, and the script says so beside its
# verdicts.
#
# **The rendition sweep is not gated.** `sweep_styles_opt` runs when the
# rendition table passes 7/8 of its load, and no input `ingest2` carries
# fills it at one rep, with or without `BAUD_FROZEN=1`: callgrind counts no
# call on any of them. It is gated once a bench feeds a recording that
# crosses the load.
d1 = "49152,12"
ll = "33554432,16"
rustc = "rustc 1.101.0-nightly (249c1e4e3 2026-11-05)"

# Ingest: `ingest2`'s timed loop, `Term::feed` and everything it calls, a
# `READ_CHUNK` at a time. `Term::feed` is inlined into it in a release
# build, so the loop is the function a toggle can name.
[gate.ingest]
bench = "ingest2"
args = "{input} 1"
fn = "ingest2::timed"
kind = "ingest"
inputs = "cat cat-cjk less git-log vim btop"

# The frame: `frame`'s timed frame, the seal and the render after each
# read of a recording, at 200x50 cells, 14 px, the bundled face. One rep,
# whose first frames fill the atlas: a run takes about 19 s under callgrind,
# and two reps about 37. `Renderer::render` and `convert_with` are inlined
# into it in a release build, so the frame is the function a toggle can
# name.
[gate.frame]
fn = "frame::timed_frame"
kind = "other"
bench = "frame"
args = "{input}"
inputs = ["btop 1 full", "btop 1 incremental", "cat 1 full", "cat 1 incremental"]

