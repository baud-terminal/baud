[package]
name = "baud-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The terminal: a pty, baud-core, baud-render and a platform presentation crate joined into one process."
# Not published: the binary, not a library anyone depends on.
publish = false

[dependencies]
baud-core = { path = "../baud-core", features = ["alloc"] }
baud-domain = { path = "../baud-domain" }
baud-font = { path = "../baud-font" }
baud-render = { path = "../baud-render" }

# The cache probe, for `host_geometry`: the per-arch crate with `std` on, so
# it may ask the kernel. Target-gated the way `baud-core` gates its scans.
[target.'cfg(target_arch = "aarch64")'.dependencies]
baud-isa = { path = "../baud-isa" }
baud-isa-aarch64 = { path = "../baud-isa-aarch64", features = ["std"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
baud-isa = { path = "../baud-isa" }
baud-isa-x86-64 = { path = "../baud-isa-x86-64", features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
baud-present-wayland = { path = "../baud-present-wayland" }
baud-wayland = { path = "../baud-wayland" }

[target.'cfg(target_os = "macos")'.dependencies]
baud-present-macos = { path = "../baud-present-macos" }
macos-liquid-glass = { git = "https://github.com/i-am-logger/macos-liquid-glass", branch = "feat/drawable-view", features = ["drawable"] }

[features]
# **A ceiling arm for row 11, off.** `present` returns early when nothing
# is pending, but only after resolving the renderer to the terminal, the
# selection's share of the view, the scrollbar's thumb and the surface's
# size -- and that preamble is what an idle tick pays. This arm returns
# at the top instead. Incorrect by construction: the preamble is also
# where a geometry change is noticed and the presenter rebuilt, so an
# arm that skips it cannot resize. Exact on an idle screen, which is the
# only thing it is for.
ceiling-idle-skip = []

# The binary is `baud`; the crate keeps its name so the workspace reads
# the same way as `baud-present-macos` beside it.
[[bin]]
name = "baud"
path = "src/main.rs"
