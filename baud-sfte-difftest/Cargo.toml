[package]
name = "baud-sfte-difftest"
version.workspace = true
edition.workspace = true
# Not published: `publish = false`, so `cargo publish` refuses it and
# release-plz leaves it out (`scripts/check-publish.py`).
# Like `baud-difftest`, it is an oracle against an external implementation,
# not a library anyone depends on.
publish = false
build = "build.rs"

[dependencies]
baud-core = { path = "../baud-core", features = ["alloc"] }
