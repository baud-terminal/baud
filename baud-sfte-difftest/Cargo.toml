[package]
name = "baud-sfte-difftest"
version.workspace = true
edition.workspace = true
# Not published, for the reason `baud-difftest` records: an oracle against an
# external implementation is not a library anyone depends on, and a release PR
# offering it to crates.io would be rejected for the metadata it does not carry.
publish = false
build = "build.rs"

[dependencies]
baud-core = { path = "../baud-core", features = ["alloc"] }
