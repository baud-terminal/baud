[package]
name = "baud-domain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The type system: every quantity is a type, every invariant the compiler can hold is held by the compiler."
rust-version.workspace = true
readme = "README.md"
keywords = ["terminal", "vt100", "unicode", "types"]
categories = ["no-std", "text-processing", "encoding"]
# What crates.io gets: the source, what the build reads, the licence and
# the notices its third-party files need (`scripts/check-publish.py`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/build.rs", "/README.md", "/LICENSE", "/LICENSES/"]

[dependencies]
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }

[dev-dependencies]
# **Oracles and generators, not dependencies**: none of the three is in a
# build of the crate. `miniz_oxide` writes and inflates the zlib streams the
# resumable inflate is checked against, `png` decodes the PNGs `png.rs` is,
# and `proptest` generates the streams and the base64 cut at random.
miniz_oxide = "0.9.1"
png = "0.17.16"
proptest = "1"

[features]
# `Pixel::zeroed_vec`: an image arena from the allocator's zeroed path, so
# its pages are committed only as images write them. For hosts with an
# allocator; `baud-core`'s `alloc` turns it on.
alloc = ["zerocopy/alloc"]
probe-double-fold = []
probe-double-sgr-color = []
probe-sgr-color-reborrow = []
colour-in-match = []
# The per-character row-extent read-modify-write, priced by doing it twice.
# Identical work, so every counter and every extent is unchanged and the cost
# is exactly one.
probe-double-extent = []
# **The cell stores, and nothing else.** `ceiling-no-write` in the core stops
# the cursor advancing too, so it also removes every wrap and every scroll and
# its `cells_written` falls by 60% -- it prices the whole write *path*, not the
# stores. This arm keeps the addressing, the bounds, the extent, the cursor and
# the scroll, and skips only the two `PackedCell` writes, so both arms attribute
# identical cells and only the stores differ.
ceiling-no-store = []
# Ceiling arm: `View::fill_row` does the bookkeeping and skips the stores.
ceiling-no-rowfill = []
