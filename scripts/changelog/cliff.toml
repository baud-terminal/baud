# git-cliff's reading of the history, for `cargo xtask changelog`.
# release-plz writes CHANGELOG.md from `release-plz.toml`'s `[changelog]`;
# this file groups the same Conventional Commit types and adds a last
# parser, `.*`, whose group is UNPARSED, so a commit no type parser matches
# shows up in git-cliff's context instead of vanishing from it. The check
# fails on any commit in that group and on any commit git-cliff does not
# read as conventional.
[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
commit_parsers = [
  { message = "^chore(\\(.+\\))?: release", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^refactor", group = "<!-- 4 -->Refactor" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^style", group = "<!-- 7 -->Style" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = "^chore", group = "<!-- 9 -->Chores" },
  { message = ".*", group = "<!-- 10 -->UNPARSED" },
]
