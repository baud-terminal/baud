# A hand-made alacritty theme; not from a published collection.
[colors.primary]
background = "#161719"
foreground = "#c5c8c7"

[colors.cursor]
text = "#1d1f22"
cursor = "#aeafad"

[colors.selection]
text = "#c5c8c8"
background = "#373b41"

[colors.search.matches]
foreground = "#000000"
background = "#ffff00"

[colors.normal]
