[package]
name = "baud-fontbuild"
version = "0.1.0"
edition = "2024"
description = "baud's font-build tools: `compare`, the glyph-level equivalence check a rebuilt font is held to"
license = "CC-BY-NC-SA-4.0"
# A build tool: nothing here is published.
publish = false

[dependencies]
# The reader both fonts are expanded through. It is not baud-font, so the
# comparison does not rest on the code the built fonts feed.
read-fonts = "=0.46.0"
