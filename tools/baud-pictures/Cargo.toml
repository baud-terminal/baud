[package]
name = "baud-pictures"
version = "0.1.0"
edition = "2024"
description = "baud's pictures: every file in assets/logo/ and the link picture, drawn from one mark, and the README's filmed logo"
license = "CC-BY-NC-SA-4.0"
# A build tool: nothing here is published.
publish = false

[dependencies]
# The rasteriser, which draws the bytes the resvg 0.48.1 command line did,
# with its default features off: the pictures hold no text and no raster images.
resvg = { version = "=0.49.0", default-features = false }
# JetBrains Mono's glyf, hmtx and cmap, read as raw points.
read-fonts = "=0.46.0"
