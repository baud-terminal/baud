[package]
name = "baud-isa-x86-64"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "CC-BY-NC-SA-4.0"
repository.workspace = true
description = "AVX2 implementations of baud-isa's domain-typed scan operations. no_std, x86-64 only."
rust-version.workspace = true
readme = "README.md"
keywords = ["simd", "avx2", "x86-64", "terminal"]
categories = ["no-std", "hardware-support"]
# What crates.io gets: the source, what the build reads, the licence and
# the notices its third-party files need (`cargo xtask publish`).
# The tests and their fixtures stay in the repository.
include = ["/src/", "/README.md", "/LICENSE", "/NOTICE"]

[dependencies]
baud-domain = { workspace = true }
baud-isa = { workspace = true }

# **`std` is a fallback, not the probe.** `CPUID` leaf 4 answers the cache
# geometry from the instruction itself and needs no operating system; the
# feature only adds Linux's sysfs walk (spelled once, in `baud-isa`) for a
# hypervisor that blanks the leaf. Off by default, and off the probe still
# works.
[features]
std = ["baud-isa/std"]
