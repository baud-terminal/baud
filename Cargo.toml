# `profile-rustflags` is what lets the release profile carry a codegen flag:
# devenv exports `RUSTFLAGS`, and an environment `RUSTFLAGS` replaces every
# `rustflags` a `.cargo/config.toml` sets, while a profile's are added to it.
# The toolchain is nightly already, for `portable_simd`.
cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = ["baud-domain", "baud-core", "baud-bench",
  "baud-isa",
  "baud-isa-x86-64",
  "baud-isa-aarch64",
  # **A member, because the reason it was excluded expired.** That reason was
  # "pins alacritty by absolute path, so it cannot resolve on a checkout that
  # has not set that path" -- and the path was
  # `/home/<user>/t/alacritty/alacritty_terminal`, which no checkout has,
  # including the one it was written on. So the crate never compiled, while
  # the build guide listed it as "the only oracle outside this repo". Pinned
  # to the registry version `multibench` already uses, it resolves anywhere,
  # and being a member is what makes `cargo test --workspace` build it --
  # which is the only thing that would have reported the break.
  "baud-difftest",
  # The second external oracle: sfte, a single-file C11 terminal, vendored
  # whole under docs/research/sources/ and compiled by this crate's build.rs.
  # A member for the reason baud-difftest is one: `cargo test --workspace`
  # building it is the only thing that reports a break.
  "baud-sfte-difftest",
  # The renderer:
  # the pure font stack, the compositor, one presentation crate per platform,
  # and the binary that joins a pty to a window. None of them touches
  # `baud-core`, which stays `no_std`, allocation-free and dependency-free.
  "baud-font",
  "baud-render",
  "baud-present-macos",
  "baud-app",
  # The table compiler the crates' build scripts share: std alone, no
  # dependencies, so a build-dependency adds nothing to a build's graph.
  "baud-tablegen",
  # The repository's gates, run as `cargo xtask <command>` through the alias
  # in `.cargo/config.toml`. Unpublished, and not a default member, so a
  # bare `cargo run` still builds the terminal.
  "xtask",
    "baud-wayland",
    "baud-xkb",
    "baud-present-wayland",
]

# bench-others/* are standalone harnesses against sibling checkouts of other
# terminals. They do not belong in this lock file.
exclude = ["bench-others"]

# **`cargo run` builds the binary the bundle ships.** `baud` is the one binary,
# and the rest is part of the tests. Without this line a bare
# `cargo run --release` resolves features across every member, and `baud-bench`
# turns on `baud-render`'s `exceptions`, which that manifest says the app does
# not get, and libc's `std`: 4,160 more bytes of `__text` than
# `scripts/bundle-macos.sh`'s `cargo build --release -p baud`, measured at
# 1e02e6b. With it a bare `cargo run`, `build`, `test` or `clippy` covers
# the `baud` package alone; the gate passes `--workspace`.
default-members = ["baud-app"]

[workspace.package]
# The version is `1.0.0-beta.N`. Every crate inherits this, and
# `baud-app/tests/version.rs` holds it to that scheme.
version = "1.0.0-beta.1"
# Deliberately 2021, not the 2024 the rust-template scaffold ships. An edition
# migration across a measured hot path is a change that needs a benchmark, not
# a flag flip.
edition = "2021"
authors = ["i-am-logger"]
description = "A fast terminal emulator with its own built-in font and cursor effects, readable from the first launch. Written in Rust."
# crates.io's equivalent of GitHub topics. Max five keywords, 20 chars each;
# categories must come from crates.io's fixed list.
keywords = ["terminal", "vt100", "ansi", "tty", "vte"]
categories = ["parser-implementations", "no-std", "text-processing"]
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/baud-terminal/baud"
# The toolchain the crates are built with is nightly 1.96 (`nix/rust.nix`):
# baud-domain and baud-font use `#![feature]`s, so no stable release builds
# them, and 1.96 is the release whose nightly does.
rust-version = "1.96"

# **A path and a version for each crate `baud` is built from.** The path is
# what the workspace builds against; the version is what a published crate
# asks crates.io for, because `cargo package` drops the path and refuses a
# dependency that has no version. Both move with the workspace version.
# `scripts/check-publish.py` holds every published crate to them.
#
# **The three crates that carry the NEON scan as a default come without
# it**, `baud-core`, `baud-render` and `baud-present-macos`, so a binary
# built here names the scan it runs. Cargo builds a dependency once, with
# every feature any crate in the build enables on it: with the defaults
# inherited here, `baud-render` and `baud-present-macos` enabled the scan
# on `baud-core`, and `cargo bench -p baud-bench --no-default-features`
# ran the NEON scan it was built to leave out. Published, each library
# keeps the scan as its own default.
[workspace.dependencies]
baud-domain = { path = "baud-domain", version = "1.0.0-beta.1" }
baud-tablegen = { path = "baud-tablegen", version = "1.0.0-beta.1" }
baud-isa = { path = "baud-isa", version = "1.0.0-beta.1" }
baud-isa-aarch64 = { path = "baud-isa-aarch64", version = "1.0.0-beta.1" }
baud-isa-x86-64 = { path = "baud-isa-x86-64", version = "1.0.0-beta.1" }
baud-core = { path = "baud-core", version = "1.0.0-beta.1", default-features = false }
baud-font = { path = "baud-font", version = "1.0.0-beta.1" }
baud-render = { path = "baud-render", version = "1.0.0-beta.1", default-features = false }
baud-xkb = { path = "baud-xkb", version = "1.0.0-beta.1" }
baud-wayland = { path = "baud-wayland", version = "1.0.0-beta.1" }
baud-present-wayland = { path = "baud-present-wayland", version = "1.0.0-beta.1" }
baud-present-macos = { path = "baud-present-macos", version = "1.0.0-beta.1", default-features = false }

# **The debug suite optimises the four crates its time is spent in, and
# every dependency.** At opt-level 0 the workspace nextest took 1531 s,
# and one test was 1503 s of it: `RIS` before every case erases the whole
# ring, and an unoptimised `fill` writes it a cell at a time. At 1 that
# test took 37 s alone. Debug assertions and overflow checks stay on: they
# are what a debug run is for. `baud-app` and the present and window
# crates stay at 0, so a debug run still lays out their constants
# unmerged, as it did when it caught a test comparing `include_bytes!`
# addresses; in the four, `audit_all.sh` holds address operations to their
# count instead. Only `dev`, and `test` through it, read these; `release`
# and `bench` do not. Measured: the debug suite spent its time in those
# four crates at opt-level 0.
[profile.dev.package.baud-domain]
opt-level = 1

[profile.dev.package.baud-core]
opt-level = 1

[profile.dev.package.baud-font]
opt-level = 1

[profile.dev.package.baud-render]
opt-level = 1

# The gates' crate too: `cargo xtask sources` hashes the 64 MB of
# docs/research/sources on every run, and its SHA-256 at opt-level 0 held
# the gate at 2.9 s; at 1 it took 0.25 s, against the shell's 0.50-0.51.
[profile.dev.package.xtask]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# **Every function starts on a 64-byte boundary.** Without it a function's
# offset in its cache line moves whenever anything linked before it changes
# size, and `cat` read -8%, -9% and +3% across three builds of one change whose
# ingest loop was instruction for instruction the same -- a layout lottery this
# repo had recorded on `cat` several times before. Aligned, all three equalled
# the base, at no cost on eleven payloads and +2.0% on the app binary's size.
# `bench` inherits this profile, and `test:unit` builds it, so the
# measurements and the tests run the code that ships.
rustflags = ["-C", "llvm-args=-align-all-functions=6"]
