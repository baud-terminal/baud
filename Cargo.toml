[workspace]
resolver = "2"
members = ["baud-domain", "baud-core", "baud-bench",
  "baud-isa",
  "baud-isa-x86-64",
  "baud-isa-aarch64",
  # **A member, because the reason it was excluded expired.** That reason was
  # "pins alacritty by absolute path, so it cannot resolve on a checkout that
  # has not set that path" -- and the path was
  # `/home/user/t/alacritty/alacritty_terminal`, which no checkout has,
  # including the one it was written on. So the crate never compiled, while
  # `BUILD.md` listed it as "the only oracle outside this repo". Pinned to the
  # registry version `multibench` already uses, it resolves anywhere, and being
  # a member is what makes `cargo test --workspace` build it -- which is the
  # only thing that would have reported the break.
  "baud-difftest",
  # The renderer, as the crates `docs/research/notes/j-rendering.md` D1 names:
  # the pure font stack, the compositor, one presentation crate per platform,
  # and the binary that joins a pty to a window. None of them touches
  # `baud-core`, which stays `no_std`, allocation-free and dependency-free.
  "baud-font",
  "baud-render",
  "baud-present-macos",
  "baud-app",
    "baud-wayland",
]

# bench-others/* are standalone harnesses against sibling checkouts of other
# terminals — and ghostty-bench is Zig. They do not belong in this lock file.
exclude = ["bench-others"]

[workspace.package]
version = "0.1.0"
# Deliberately 2021, not the 2024 the rust-template scaffold ships. An edition
# migration across a measured hot path is a change that needs a benchmark, not
# a flag flip.
edition = "2021"
authors = ["i-am-logger"]
description = "A terminal emulator written in Rust, under construction."
# crates.io's equivalent of GitHub topics. Max five keywords, 20 chars each;
# categories must come from crates.io's fixed list.
keywords = ["terminal", "vt100", "ansi", "tty", "vte"]
categories = ["parser-implementations", "no-std", "text-processing"]
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/i-am-logger/baud"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
