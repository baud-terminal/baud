# Release configuration. https://release-plz.dev/docs/config
#
# **Publishing runs locally, by hand; no hosted service runs it.** From a
# checkout of master's tip on which `devenv test` and, on an x86_64 host with
# AVX2, `devenv tasks run test:x86-avx2` have passed (the deleted Release job
# ran only after both), inside the dev shell (the workspace manifest's
# `cargo-features` needs its nightly; the dev shell does not carry release-plz
# itself, so install 0.3.172 beside it), and only once the repository is
# public, in this order:
#
#   1. `cargo xtask publish --release`, which refuses while a shipped file's
#      licence row is open, unverified, no-grant or copyleft: crates.io
#      cannot take a version back;
#   2. `release-plz release`, which publishes, tags and makes `baud`'s
#      GitHub release, and does so only from the commit of a merged
#      Release PR (`release_always` below);
#   3. `release-plz release-pr`, which opens the next Release PR. It runs
#      after 2 because it computes the bump from the newest version on
#      crates.io.
#
# release-plz 0.3.172 is the version this file was read against. It takes
# a GitHub token as `--git-token`, and `cargo publish` a crates.io token
# from `CARGO_REGISTRY_TOKEN`. Nothing checks the order, the branch or
# that the repository is public: whoever runs the release does.
#
# **The next version is release-plz's to set.** Once `1.0.0-unstable` is on
# crates.io, a commit since makes the next one `1.0.0-unstable.1`, then
# `1.0.0-unstable.2`: on a pre-release every commit is a pre-release bump,
# which adds one to a numeric last identifier and appends `.1` to any other,
# and a bare `unstable` is the other (`increment_prerelease` in its
# `next_version` crate, whose tests pin `1.0.0-alpha` to `1.0.0-alpha.1`). A
# version not yet published stays as it is. SemVer orders `1.0.0-unstable`
# before `1.0.0-unstable.1`: "A larger set of pre-release fields has a higher
# precedence than a smaller set, if all of the preceding identifiers are
# equal" (`[[source: semver]]`, rule 11.4.4).
#
# **The series goes from `-unstable` straight to `1.0.0`, never through an
# `-rc`.** SemVer compares pre-release identifiers that hold letters
# "lexically in ASCII sort order" (rule 11.4.2), so `beta` < `rc` <
# `unstable` (b 0x62, r 0x72, u 0x75), and every `1.0.0-rc.N` sorts below
# every `1.0.0-unstable.N`: an rc published after them would be older than
# all of them by precedence. A release sorts above all of its pre-releases
# (rule 11.3), so `1.0.0`, set in the manifest by hand, is the step out. The
# identifier stays lowercase: ASCII puts every capital before every small
# letter. `scripts/bundle-macos.sh` refuses any other pre-release, `-rc`
# and `-beta` among them, and `baud-app/tests/version.rs` holds it to that.
#
# **A bump leaves `tools/` stale, and a Release PR has to carry the repair.**
# `baud-fontbuild` depends on `baud-font`, so `tools/Cargo.lock` names the
# workspace's version, release-plz does not touch it, and
# `scripts/build-fonts.sh`, which builds `--locked`, refuses to start. On the
# Release PR's branch:
#
#   a. `cargo update --manifest-path tools/Cargo.toml -p baud-font
#      -p baud-domain -p baud-tablegen`, the three the lock file holds;
#   b. the sha256 of `tools/Cargo.lock` on its `input` line in
#      `baud-app/fonts/built/MANIFEST`, by hand and that line alone: a build
#      also rewrites the `#` lines, which are the building machine's;
#   c. `scripts/build-fonts.sh --check`, which has to pass;
#   d. `cargo metadata --format-version 1` with `--manifest-path` at
#      `bench-others/ghostty-oracle/Cargo.toml` and
#      `bench-others/multibench/Cargo.toml`, whose lock files name the same
#      version; a `--locked` build there would refuse too.
#
# This file decides what gets released. `baud` and the crates it is built
# from are published to crates.io, so `cargo install baud` installs the
# terminal; `cargo xtask publish` says which crates those are.

[workspace]
# Defaults for every member; the per-package blocks at the end override what
# has to differ. Without them every crate would claim the same tag, since
# the name is a literal rather than a template over the package.
git_release_enable = false

# "auto" marks a version carrying a pre-release suffix as a GitHub
# pre-release, so an unstable version does not present itself as the latest
# stable download.
git_release_type = "auto"

# cargo-semver-checks before each release: a breaking change proposed as a
# patch bump is rejected and the version escalated. Every bump between
# pre-release versions is a major change, which permits anything, so this
# guards nothing during the 1.0.0-unstable series; it is on so that it starts
# working by itself after 1.0.0.
semver_check = true

# Publishing requires merging a Release PR. An ordinary commit landing on
# master does not publish, however it got there. crates.io is immutable, so
# the second merge is the point.
release_always = false

pr_labels = ["release", "automated"]

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# The changelog carries what a user would notice. Everything else -- build,
# ci, chore, refactor, style, test, revert and release-plz's own release
# commits -- is skipped by the trailing catch-all. Group names match the
# Keep a Changelog headings the header promises. These replace git-cliff's
# defaults rather than adding to them, so feat and fix have to be listed for
# them to appear at all. `scripts/check-changelog.sh` holds every commit to a
# Conventional Commit of a listed type, so none is skipped by mistake.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^doc", group = "Documentation" },
  { message = ".*", skip = true },
]

# baud is the crate anyone installs, so it is the one that gets a GitHub
# release, and its changelog is the repository's: it takes in the commits of
# the crates it is built from, which a user of the terminal notices.
[[package]]
name = "baud"
git_tag_name = "baud-v{{ version }}"
git_release_enable = true
changelog_path = "CHANGELOG.md"
changelog_include = [
  "baud-core", "baud-domain", "baud-font", "baud-render",
  "baud-present-macos", "baud-present-wayland", "baud-wayland", "baud-xkb",
  "baud-isa", "baud-isa-aarch64", "baud-isa-x86-64", "baud-tablegen",
]

# The rest are published because cargo requires it, not because anyone
# installs them: a crate cannot go to crates.io with a path dependency that
# is not there, so `baud` is unpublishable unless each crate it is built from
# is published alongside. Each is tagged separately to keep the histories
# apart, and gets no GitHub release: there is nothing to download, and a
# second entry on the releases page would suggest otherwise.
[[package]]
name = "baud-core"
git_tag_name = "baud-core-v{{ version }}"

[[package]]
name = "baud-domain"
git_tag_name = "baud-domain-v{{ version }}"

[[package]]
name = "baud-font"
git_tag_name = "baud-font-v{{ version }}"

[[package]]
name = "baud-render"
git_tag_name = "baud-render-v{{ version }}"

[[package]]
name = "baud-present-macos"
git_tag_name = "baud-present-macos-v{{ version }}"

[[package]]
name = "baud-present-wayland"
git_tag_name = "baud-present-wayland-v{{ version }}"

[[package]]
name = "baud-wayland"
git_tag_name = "baud-wayland-v{{ version }}"

[[package]]
name = "baud-xkb"
git_tag_name = "baud-xkb-v{{ version }}"

[[package]]
name = "baud-isa"
git_tag_name = "baud-isa-v{{ version }}"

[[package]]
name = "baud-isa-aarch64"
git_tag_name = "baud-isa-aarch64-v{{ version }}"

[[package]]
name = "baud-isa-x86-64"
git_tag_name = "baud-isa-x86-64-v{{ version }}"

[[package]]
name = "baud-tablegen"
git_tag_name = "baud-tablegen-v{{ version }}"
