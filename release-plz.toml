# Release configuration. **baud publishes nothing and releases nothing**: the
# owner's "no publishing, private". The release-plz jobs in ci.yml still run
# on every master push -- CI is left as it is -- and this file and the
# manifests are what make each run a no-op. The source lines behind every
# claim here are in docs/record.md, "Nothing is published, and release-plz
# opens no Release PR".
#
# https://release-plz.dev/docs/config
#
# **What does the work is `publish = false` in every crate's Cargo.toml.**
# release-plz 0.3.160, the version `release-plz/action@v0.5.131` installs,
# releases only packages cargo can publish, versions only those, and opens no
# Release PR when nothing needs a new version. So `release` skips any push
# that is not a Release PR's merge ("skipping release: current commit is not
# from a release PR") and on one finds nothing to release, and `release-pr`
# opens nothing; both exit 0.
#
# **Not `release = false`**, the setting that reads like the switch. It drops
# every package before anything runs, and release-plz then fails with "no
# public packages found", so both jobs would go red on every master push.

[workspace]
# For a crate added later without `publish = false`: `release_commits` below
# keeps release-pr from proposing it, and if a PR were merged anyway it would
# neither run `cargo publish` nor create a git tag or a GitHub release.
publish = false
git_tag_enable = false
git_release_enable = false
# No commit can match this regex (a word boundary and a non-boundary at one
# position), so release-pr bumps nothing and opens no Release PR even for
# a crate added later without `publish = false`.
release_commits = "\\b\\B"

# Only merging a Release PR releases; an ordinary push to master does not.
release_always = false

# Filterable in the GitHub UI as `is:pr label:release`, and excludable from
# "needs human review" queries with `-label:automated`.
pr_labels = ["release", "automated"]

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Release commits are not changes. Parsed in, each one back-fills a changelog
# entry and opens another release PR, which produces another release commit.
#
# The optional-scope group catches both forms release-plz emits: the unscoped
# aggregate `chore: release` and the per-package `chore(<package>): release v<x>`.
commit_parsers = [
  { message = "^chore(\\(.+\\))?: release", skip = true },
]
