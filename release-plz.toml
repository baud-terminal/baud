# Release configuration. https://release-plz.dev/docs/config
#
# The workflow restricts releasing to master, and to the repository once it
# is public (`.github/workflows/ci.yml`); this file decides what gets
# released once there. `baud` and the crates it is built from are published
# to crates.io, so `cargo install baud` installs the terminal;
# `scripts/check-publish.py` says which crates those are.

[workspace]
# Defaults for every member; the per-package blocks at the end override what
# has to differ. Without them every crate would claim the same tag, since
# the name is a literal rather than a template over the package.
git_release_enable = false

# "auto" marks a version carrying a pre-release suffix as a GitHub
# pre-release, so a beta does not present itself as the latest stable
# download.
git_release_type = "auto"

# cargo-semver-checks before each release: a breaking change proposed as a
# patch bump is rejected and the version escalated. Every bump between
# pre-release versions is a major change, which permits anything, so this
# guards nothing during the 1.0.0-beta series; it is on so that it starts
# working by itself after 1.0.0.
semver_check = true

# Publishing requires merging a Release PR. An ordinary commit landing on
# master does not publish, however it got there. crates.io is immutable, so
# the second merge is the point.
release_always = false

pr_labels = ["release", "automated"]

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# The changelog carries what a user would notice. Everything else -- build,
# ci, chore, refactor, style, test, revert and release-plz's own release
# commits -- is skipped by the trailing catch-all. Group names match the
# Keep a Changelog headings the header promises. These replace git-cliff's
# defaults rather than adding to them, so feat and fix have to be listed for
# them to appear at all. `scripts/check-changelog.sh` holds every commit to a
# Conventional Commit of a listed type, so none is skipped by mistake.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^doc", group = "Documentation" },
  { message = ".*", skip = true },
]

# baud is the crate anyone installs, so it is the one that gets a GitHub
# release, and its changelog is the repository's: it takes in the commits of
# the crates it is built from, which a user of the terminal notices.
[[package]]
name = "baud"
git_tag_name = "baud-v{{ version }}"
git_release_enable = true
changelog_path = "CHANGELOG.md"
changelog_include = [
  "baud-core", "baud-domain", "baud-font", "baud-render",
  "baud-present-macos", "baud-present-wayland", "baud-wayland", "baud-xkb",
  "baud-isa", "baud-isa-aarch64", "baud-isa-x86-64", "baud-tablegen",
]

# The rest are published because cargo requires it, not because anyone
# installs them: a crate cannot go to crates.io with a path dependency that
# is not there, so `baud` is unpublishable unless each crate it is built from
# is published alongside. Each is tagged separately to keep the histories
# apart, and gets no GitHub release: there is nothing to download, and a
# second entry on the releases page would suggest otherwise.
[[package]]
name = "baud-core"
git_tag_name = "baud-core-v{{ version }}"

[[package]]
name = "baud-domain"
git_tag_name = "baud-domain-v{{ version }}"

[[package]]
name = "baud-font"
git_tag_name = "baud-font-v{{ version }}"

[[package]]
name = "baud-render"
git_tag_name = "baud-render-v{{ version }}"

[[package]]
name = "baud-present-macos"
git_tag_name = "baud-present-macos-v{{ version }}"

[[package]]
name = "baud-present-wayland"
git_tag_name = "baud-present-wayland-v{{ version }}"

[[package]]
name = "baud-wayland"
git_tag_name = "baud-wayland-v{{ version }}"

[[package]]
name = "baud-xkb"
git_tag_name = "baud-xkb-v{{ version }}"

[[package]]
name = "baud-isa"
git_tag_name = "baud-isa-v{{ version }}"

[[package]]
name = "baud-isa-aarch64"
git_tag_name = "baud-isa-aarch64-v{{ version }}"

[[package]]
name = "baud-isa-x86-64"
git_tag_name = "baud-isa-x86-64-v{{ version }}"

[[package]]
name = "baud-tablegen"
git_tag_name = "baud-tablegen-v{{ version }}"
