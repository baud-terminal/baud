[package]
name = "baud-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PTY benchmark harness for baud-core. Linux-only."

[dependencies]
# **`default-features = false` so the scan arm is reachable from here.**
# `baud-core`'s `neon-scan` is on by default, and `cargo build -p baud-bench
# --no-default-features` does *not* turn it off -- that flag disables this
# crate's defaults, not a dependency's. Without this line the A/B could not be
# run at all, and the first attempt at it silently compared a cached binary
# against itself.
baud-core = { path = "../baud-core", default-features = false, features = ["alloc"] }
baud-domain = { path = "../baud-domain" }
baud-font = { path = "../baud-font" }
baud-render = { path = "../baud-render" }
libc = "0.2"
zerocopy = "0.8"

# `frame_gpu` draws the same frames through Metal; the crate compiles to
# nothing elsewhere and the bin says so.
[target.'cfg(target_os = "macos")'.dependencies]
baud-present-macos = { path = "../baud-present-macos" }

# The cache probe, for `host_geometry`: the per-arch crate with `std` on, so
# it may ask the kernel. Target-gated the way `baud-core` gates its scans.
[target.'cfg(target_arch = "aarch64")'.dependencies]
baud-isa = { path = "../baud-isa" }
baud-isa-aarch64 = { path = "../baud-isa-aarch64", features = ["std"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
baud-isa = { path = "../baud-isa" }
baud-isa-x86-64 = { path = "../baud-isa-x86-64", features = ["std"] }


[features]
default = ["neon-scan"]
# Forwarded so `cargo run -p baud-bench --features diag --bin ingest` prints
# the cost map. Never on for a throughput figure -- see baud-core/Cargo.toml.
diag = ["baud-core/diag"]
# Byte-level attribution: which path consumed which bytes. Never on for a
# throughput figure, same as `diag`.
# Build `ingest` against the aarch64 `shrn` scanner instead of the portable one.
scan-neon = []
# The grid's row pitch, for `ingest2`'s stride arms. Off, the pitch is what
# ships: `grid_stride`, from the cache geometry. `stride-live` lays
# the grid out at the live column count, the layout this core had before and
# the one the fixed pitch must match; `stride-pad0` at `MAX_COLS`, exactly one
# L1 way a row on this class of machine, the aliasing layout the +14% was
# measured against -- the positive control. Mutually exclusive by
# construction: both at once does not compile.
stride-live = []
stride-pad0 = []
# The exploration arm: the pitch from `BAUD_STRIDE`, in cells, read once at
# start. Not a runtime switch in the loop -- the pitch is a field whichever
# arm sets it -- so one binary sweeps candidate pitches; what ships is still
# decided by `grid_stride` and measured with the arms above.
stride-env = []
# The new core's arms, named apart from core2's so one `--features` cannot
# silently arm the wrong crate.
new-no-write = ["baud-core/ceiling-no-write"]
new-no-classify = ["baud-core/ceiling-no-classify"]
new-no-decode = ["baud-core/ceiling-no-decode"]
new-no-scroll = ["baud-core/ceiling-no-scroll"]
new-no-blank = ["baud-core/ceiling-no-blank"]
new-no-text = ["baud-core/ceiling-no-text"]
probe-double-extent = ["baud-core/probe-double-extent"]
new-no-store = ["baud-core/ceiling-no-store"]
new-double-classify = ["baud-core/probe-double-classify"]
new-double-break = ["baud-core/probe-double-break"]
new-double-attach = ["baud-core/probe-double-attach"]
new-no-run-gate = ["baud-core/ceiling-no-run-gate"]
new-no-act = ["baud-core/ceiling-no-act"]
new-double-decode = ["baud-core/probe-double-decode"]
new-free-width = ["baud-core/probe-free-width"]
new-pinned-node = ["baud-core/probe-pinned-node"]
new-const-stride = ["baud-core/probe-const-stride"]
new-double-scan = ["baud-core/probe-double-scan"]
ascii-only = ["baud-core/ascii-only"]
cell-table = ["baud-core/cell-table"]
# The aarch64 run scan through `baud-isa-aarch64::Neon`; see baud-core. It is in
# `default` here so `ingest2` measures what a default `baud-core` does, and
# `--no-default-features` is the arm that turns it off.
neon-scan = ["baud-core/neon-scan"]
# **The x86-64 twin, and its absence is why the AVX2 path had never been
# timed.** Every other `baud-core` arm in this list is forwarded; this one was
# not, so `--features avx2-scan` named nothing here and the only harness that
# measures throughput could not reach the code. CI proved the path *correct* on
# x86-64 the whole time, which is the shape that makes an absence comfortable:
# one gate was green and the other did not exist.
#
# Deliberately **not** in `default`, unlike `neon-scan`. NEON is baseline on
# aarch64, so a default build there runs it; AVX2 is not baseline on x86-64, so
# enabling it by default would build a binary that faults on a host without it.
# It needs `-C target-feature=+avx2` alongside, which is the caller's to set.
avx2-scan = ["baud-core/avx2-scan"]
param3 = ["baud-core/param3"]
probe-no-fast-csi = ["baud-core/probe-no-fast-csi"]
probe-no-csi-op = ["baud-core/probe-no-csi-op"]
probe-no-csi-params = ["baud-core/probe-no-csi-params"]
probe-double-params = ["baud-core/probe-double-params"]
probe-csi-scratch = ["baud-core/probe-csi-scratch"]
two-pass-csi = ["baud-core/two-pass-csi"]
route-stride = ["baud-core/route-stride"]
probe-double-final-scan = ["baud-core/probe-double-final-scan"]
ceiling-free-sgr = ["baud-core/ceiling-free-sgr"]
ceiling-no-region-copy = ["baud-core/ceiling-no-region-copy"]
ceiling-segment-cache = ["baud-core/ceiling-segment-cache"]
sgr-table = ["baud-core/sgr-table"]
probe-double-text-scan = ["baud-core/probe-double-text-scan"]
probe-double-sgr = ["baud-core/probe-double-sgr"]
probe-sgr-copy = ["baud-core/probe-sgr-copy"]
probe-double-fold = ["baud-core/probe-double-fold"]
probe-double-sgr-color = ["baud-core/probe-double-sgr-color"]
probe-sgr-color-reborrow = ["baud-core/probe-sgr-color-reborrow"]
colour-in-match = ["baud-core/colour-in-match"]
probe-double-intern = ["baud-core/probe-double-intern"]
probe-double-intern-full = ["baud-core/probe-double-intern-full"]
probe-double-parse = ["baud-core/probe-double-parse"]
# The harness alone: the chunk is copied into the arena and never parsed, so
# the reported rate is what `write_at` costs. Every arm pays it, and a ceiling
# arm that runs at thousands of MB/s is measuring it as much as the loop.
harness-only = []
new-double-put = ["baud-core/probe-double-put"]
